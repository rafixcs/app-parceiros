openapi: 3.1.0
info:
  title: App Parceiros API
  version: 0.1.0
  description: >
    Contrato da API do App Parceiros. É a fonte da verdade: altere aqui
    antes de implementar e gere os clientes a partir deste arquivo.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Verificação de vida do processo
      operationId: healthz
      security: []
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      summary: Verificação de prontidão (Postgres e Redis)
      operationId: readyz
      security: []
      responses:
        "200":
          description: Todas as dependências respondem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prontidao"
        "503":
          description: Alguma dependência falhou
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prontidao"
  /v1/auth/register:
    post:
      summary: Cria uma conta com e-mail e senha (provedor interno)
      description: >
        Só existe com AUTH_PROVIDER=internal. Cria a conta, manda o link de
        confirmação do e-mail e já abre uma sessão. O usuário e o workspace
        pessoal são criados no primeiro GET /v1/eu, como em qualquer provedor.
      operationId: authRegister
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegister" }
      responses:
        "201":
          description: Conta criada e sessão aberta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`email_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`invalid_email`, `invalid_name` ou `weak_password`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
  /v1/auth/login:
    post:
      summary: Entra com e-mail e senha (provedor interno)
      operationId: authLogin
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLogin" }
      responses:
        "200":
          description: Sessão aberta. Use o token como Bearer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/Erro" }
        "401":
          description: "`invalid_credentials`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429":
          description: "`too_many_attempts`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/auth/logout:
    post:
      summary: Encerra a sessão do token (provedor interno)
      operationId: authLogout
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Sessão encerrada }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /v1/auth/email/verify:
    post:
      summary: Confirma o e-mail com o token do link enviado (provedor interno)
      operationId: authVerifyEmail
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthToken" }
      responses:
        "204": { description: E-mail confirmado }
        "400": { $ref: "#/components/responses/Erro" }
        "410":
          description: "`invalid_auth_token`: o link expirou ou já foi usado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/auth/email/resend:
    post:
      summary: Manda de novo o link de confirmação do e-mail (provedor interno)
      operationId: authResendVerification
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Link enviado, ou e-mail já confirmado }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "429": { $ref: "#/components/responses/Erro" }
  /v1/auth/password/forgot:
    post:
      summary: Pede o link para redefinir a senha (provedor interno)
      description: >
        Responde 202 mesmo quando o e-mail não tem conta, para não revelar
        quem está cadastrado.
      operationId: authForgotPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Pedido recebido }
        "400": { $ref: "#/components/responses/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
  /v1/auth/password/reset:
    post:
      summary: Define uma nova senha com o token do link enviado (provedor interno)
      description: Encerra todas as sessões abertas da conta.
      operationId: authResetPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Senha trocada }
        "400": { $ref: "#/components/responses/Erro" }
        "410":
          description: "`invalid_auth_token`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`weak_password`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/eu:
    get:
      summary: Usuário autenticado
      description: >
        No primeiro acesso, cria o usuário a partir do perfil do provedor de
        identidade (Zitadel ou o provedor interno) e o seu workspace pessoal.
      operationId: eu
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /v1/workspaces:
    get:
      summary: Workspaces de que o usuário participa (seletor do topo)
      operationId: listarWorkspaces
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspaces, o pessoal primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      summary: Criar mentoria
      description: Cria um workspace do tipo mentoria com o usuário como dono.
      operationId: criarMentoria
      tags: [contas]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              additionalProperties: false
              properties:
                nome: { type: string, minLength: 1, maxLength: 80 }
                foto_url: { type: [string, "null"], format: uri, description: "URL https" }
      responses:
        "201":
          description: Mentoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Detalhe do workspace
      operationId: verWorkspace
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Alterar nome e foto (só o dono)
      operationId: atualizarWorkspace
      tags: [contas]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nome: { type: string, minLength: 1, maxLength: 80 }
                foto_url:
                  type: string
                  description: URL https. String vazia remove a foto.
      responses:
        "200":
          description: Workspace atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/membros:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Membros do workspace (dono e mentor)
      operationId: listarMembros
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Membros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/membros/{usuarioId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: usuarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Sair do workspace ou remover um membro
      description: >
        Com o próprio id, o usuário sai do workspace. Dono e mentor removem
        afiliados; só o dono remove mentores; o dono não sai nem é removido.
        Os dados pessoais do afiliado (coleção, credencial) continuam dele.
      operationId: removerMembro
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Removido }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/convites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Convites pendentes (dono e mentor)
      operationId: listarConvites
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Convites ainda válidos, sem o token
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Convite" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
    post:
      summary: Convidar afiliado
      description: >
        Gera um convite de uso único para um workspace de mentoria. Com
        e-mail, só a conta com aquele e-mail verificado pode aceitar, e o link
        também vai por e-mail (`email_enviado`). Convites
        pendentes ocupam assento do plano. O token só aparece nesta resposta.
      operationId: criarConvite
      tags: [contas]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: [string, "null"], format: email }
                validade_horas:
                  type: integer
                  minimum: 1
                  maximum: 720
                  default: 168
      responses:
        "201":
          description: Convite criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConviteCriado" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`so_mentoria` ou `sem_assentos`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/convites/{conviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: conviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Cancelar convite pendente
      operationId: revogarConvite
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Cancelado }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/convites/{token}:
    parameters:
      - $ref: "#/components/parameters/TokenConvite"
    get:
      summary: Ver convite (público)
      description: Mostra o workspace e a situação do convite antes do login.
      operationId: verConvite
      security: []
      tags: [contas]
      responses:
        "200":
          description: Convite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvitePublico" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/convites/{token}/aceitar:
    parameters:
      - $ref: "#/components/parameters/TokenConvite"
    post:
      summary: Aceitar convite
      description: Torna o usuário afiliado do workspace do convite.
      operationId: aceitarConvite
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspace em que o usuário entrou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403":
          description: "`convite_outro_email`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`ja_membro` ou `sem_assentos`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "410":
          description: "`convite_expirado`, `convite_usado` ou `convite_revogado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/eu/shopee:
    get:
      summary: Situação da conexão com a Shopee
      description: >
        A credencial (AppID e Secret da Open API de afiliados) pertence ao
        usuário, não ao workspace. O Secret nunca aparece em resposta.
      operationId: verConexaoShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Situação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConexaoShopee" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    put:
      summary: Conectar a conta de afiliado
      description: >
        Valida o AppID e o Secret com uma chamada de teste à Shopee e guarda a
        credencial cifrada (envelope encryption). Substitui a credencial
        anterior, se houver.
      operationId: conectarShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, secret]
              additionalProperties: false
              properties:
                app_id: { type: string, pattern: "^[0-9]{1,20}$" }
                secret: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
      responses:
        "200":
          description: Conectado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConexaoShopee" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "422":
          description: "`dados_invalidos` ou `credencial_invalida` (a Shopee recusou o AppID ou o Secret)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429":
          description: "`shopee_limite` (a Shopee limitou as chamadas; tente de novo em instantes)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "502":
          description: "`shopee_indisponivel`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      summary: Desconectar (apaga a credencial)
      operationId: desconectarShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Desconectado }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /v1/workspaces/{workspaceId}/radar:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Radar de produtos em alta
      description: >
        Lista ranqueada do catálogo coletado pelo job `snapshot_catalogo`
        (credencial do app) com o score do job `calcular_tendencias`.
        Valores em centavos e comissão em basis points (1% = 100).
      operationId: radar
      tags: [radar]
      security: [{ bearer: [] }]
      parameters:
        - { name: categoria, in: query, schema: { type: integer, format: int64 } }
        - { name: preco_min, in: query, description: Centavos, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: preco_max, in: query, description: Centavos, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: comissao_min, in: query, description: Basis points, schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { name: nota_min, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: q, in: query, description: Busca no nome do produto e da loja, schema: { type: string, maxLength: 100 } }
        - name: ordem
          in: query
          schema: { type: string, enum: [tendencia, comissao, ganho, vendas], default: tendencia }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        "200":
          description: Página do radar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarPagina" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/radar/categorias:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Categorias presentes no radar (para o filtro)
      operationId: radarCategorias
      tags: [radar]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Categorias, as com mais produtos primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Categoria" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/radar/produtos/{produtoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: produtoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Detalhe do produto com histórico
      operationId: radarProduto
      tags: [radar]
      security: [{ bearer: [] }]
      parameters:
        - { name: dias, in: query, description: Janela do histórico, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200":
          description: Produto e snapshots da janela, do mais antigo ao mais novo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/itens:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Produtos salvos pelo usuário no workspace
      description: >
        A coleção é do usuário dentro do workspace. Ninguém mais a vê, nem o
        mentor. Os mais recentes primeiro.
      operationId: listarItens
      tags: [colecoes]
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, description: Busca no título próprio e no nome do produto, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/StatusItem" } }
        - { name: colecao, in: query, description: Só os itens desta coleção, schema: { type: string, format: uuid } }
        - { name: tag, in: query, schema: { type: string, maxLength: 30 } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Página de itens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItensPagina" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    post:
      summary: Salvar produto
      description: >
        Salva um produto do radar (`produto_id`) ou colado como link da Shopee
        (`url`); informe só um dos dois. Um produto que não está no catálogo
        é buscado na Shopee com a credencial do app. O link de afiliado é
        gerado em segundo plano (job `gerar_link`) com a credencial do
        usuário, um por canal. Sem credencial conectada, o item fica com
        `link_status` = `pendente`. Salvar de novo o mesmo produto devolve o
        item existente (200).
      operationId: salvarItem
      tags: [colecoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                produto_id: { type: string, format: uuid }
                url: { type: string, maxLength: 2000, description: "Link do produto na Shopee, ex.: https://shopee.com.br/Nome-i.123.456" }
      responses:
        "200":
          description: O produto já estava salvo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "201":
          description: Salvo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404":
          description: "`produto_nao_encontrado` (nem no catálogo nem na Shopee) ou `workspace_nao_encontrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`dados_invalidos`, `link_invalido` ou `link_curto`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429":
          description: "`shopee_limite`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "502":
          description: "`shopee_indisponivel`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503":
          description: "`importacao_indisponivel` (o servidor não tem a credencial do app para buscar produtos fora do catálogo)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/itens/produtos:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: IDs dos produtos já salvos (para marcar o radar)
      operationId: produtosSalvos
      tags: [colecoes]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: produto_id de cada item salvo
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/itens/links-pendentes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Gerar os links que ficaram pendentes ou falharam
      description: Use depois de conectar a conta da Shopee. Itens com link manual não mudam.
      operationId: gerarLinksPendentes
      tags: [colecoes]
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Itens enfileirados
          content:
            application/json:
              schema:
                type: object
                required: [enfileirados]
                properties:
                  enfileirados: { type: integer }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`sem_credencial` (conecte a conta da Shopee antes)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/itens/{itemId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ItemId"
    get:
      summary: Detalhe do item
      operationId: verItem
      tags: [colecoes]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Editar título, descrição, notas, tags, status e link
      description: >
        Campos ausentes não mudam. Texto vazio apaga o campo. `link_afiliado`
        com uma URL grava um link manual, que tem prioridade sobre o
        automático; `null` volta ao link automático e gera de novo.
      operationId: atualizarItem
      tags: [colecoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                titulo: { type: string, maxLength: 200 }
                descricao: { type: string, maxLength: 2000 }
                notas: { type: string, maxLength: 5000 }
                tags:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 30 }
                status: { $ref: "#/components/schemas/StatusItem" }
                link_afiliado: { type: [string, "null"], maxLength: 500, description: "URL https" }
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      summary: Remover o item (e os seus links)
      operationId: removerItem
      tags: [colecoes]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Removido }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/itens/{itemId}/link:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ItemId"
    post:
      summary: Gerar o link automático de novo
      description: Descarta o link manual, se houver, e enfileira o job `gerar_link`.
      operationId: gerarLinkItem
      tags: [colecoes]
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Item com `link_status` = `gerando`, ou `pendente` sem credencial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/itens/{itemId}/colecoes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ItemId"
    put:
      summary: Definir as coleções do item
      description: Substitui a lista. Um item pode estar em várias coleções.
      operationId: definirColecoesItem
      tags: [colecoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [colecao_ids]
              additionalProperties: false
              properties:
                colecao_ids:
                  type: array
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404":
          description: "`item_nao_encontrado` ou `colecao_nao_encontrada`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/colecoes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Coleções (pastas) do usuário no workspace
      operationId: listarColecoes
      tags: [colecoes]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Coleções em ordem alfabética
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Colecao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
    post:
      summary: Criar coleção
      operationId: criarColecao
      tags: [colecoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              additionalProperties: false
              properties:
                nome: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Colecao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`colecao_existente`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/colecoes/{colecaoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: colecaoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Renomear coleção
      operationId: renomearColecao
      tags: [colecoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              additionalProperties: false
              properties:
                nome: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: Renomeada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Colecao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`colecao_existente`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      summary: Apagar coleção
      description: Os itens continuam salvos; só saem da coleção.
      operationId: apagarColecao
      tags: [colecoes]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Apagada }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Listas da curadoria
      description: >
        Dono e mentor veem os rascunhos (primeiro) e as publicadas; os
        afiliados, só as publicadas. Das mais novas para as mais antigas.
      operationId: listarListas
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Listas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lista" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
    post:
      summary: Criar lista (dono e mentor)
      description: Cria um rascunho vazio num workspace de mentoria, dentro do limite de listas do plano.
      operationId: criarLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo]
              additionalProperties: false
              properties:
                titulo: { type: string, minLength: 1, maxLength: 120 }
                descricao: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`so_mentoria` ou `limite_listas`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
    get:
      summary: Lista com os produtos
      description: >
        Cada produto que quem vê já tem na coleção vem em `meu_item`, com o
        link de afiliado dele. Rascunhos dão 404 para afiliados.
      operationId: verLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Editar título e descrição (dono e mentor)
      operationId: editarLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                titulo: { type: string, minLength: 1, maxLength: 120 }
                descricao: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Lista editada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      summary: Apagar lista (dono e mentor)
      description: O que os afiliados já importaram continua na coleção deles.
      operationId: apagarLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Apagada }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}/itens:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
    post:
      summary: Adicionar produto à lista (dono e mentor)
      description: >
        Do radar (`produto_id`) ou colado como link da Shopee (`url`), como
        ao salvar na coleção. Entra no fim da lista. Até 100 produtos.
      operationId: adicionarProdutoLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                produto_id: { type: string, format: uuid }
                url: { type: string, maxLength: 2000 }
                comentario: { type: string, maxLength: 1000, description: Dica do mentor sobre o produto }
      responses:
        "201":
          description: Lista com o produto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404":
          description: "`lista_nao_encontrada` ou `produto_nao_encontrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "409":
          description: "`ja_na_lista` ou `lista_cheia`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`dados_invalidos`, `link_invalido` ou `link_curto`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429": { $ref: "#/components/responses/Erro" }
        "502": { $ref: "#/components/responses/Erro" }
        "503": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}/itens/{produtoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
      - name: produtoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Trocar o comentário de um produto (dono e mentor)
      operationId: comentarProdutoLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comentario]
              additionalProperties: false
              properties:
                comentario: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Lista atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      summary: Tirar produto da lista (dono e mentor)
      operationId: removerProdutoLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}/ordem:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
    put:
      summary: Reordenar produtos (dono e mentor)
      description: Envie todos os produtos da lista, cada um uma vez, na nova ordem.
      operationId: ordenarLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [produto_ids]
              additionalProperties: false
              properties:
                produto_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Lista reordenada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}/publicar:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
    post:
      summary: Publicar para a turma (dono e mentor)
      description: >
        Mostra a lista para todo o workspace e avisa cada membro, menos quem
        publicou, na caixa de notificações, por e-mail e por Web Push (job
        `entregar_notificacao`). Publicar de novo não avisa de novo.
      operationId: publicarLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`lista_vazia`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}/importar:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
    post:
      summary: Importar a lista para a minha coleção
      description: >
        Salva os produtos escolhidos (todos, se `produto_ids` vier vazio) na
        coleção de quem importa, com o comentário do mentor nas notas. Os
        links saem com a credencial da Shopee do próprio usuário (job
        `gerar_link`); sem credencial, ficam pendentes. Com `colecao` (padrão),
        os itens também vão para uma coleção com o nome da lista. Importar de
        novo só salva o que falta.
      operationId: importarLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                produto_ids: { type: array, items: { type: string, format: uuid } }
                colecao: { type: boolean, default: true }
      responses:
        "200":
          description: Resultado da importação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoImportacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`lista_nao_publicada` ou `lista_vazia`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}/painel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
    get:
      summary: Quem da turma importou a lista (dono e mentor)
      operationId: painelLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Painel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PainelLista" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/listas/{listaId}/videos/{videoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListaId"
      - $ref: "#/components/parameters/VideoId"
    put:
      summary: Anexar vídeo à lista (dono e mentor)
      description: >
        Anexa um vídeo da biblioteca de quem edita a lista. O vídeo passa a
        ser compartilhado com a turma.
      operationId: anexarVideoLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista com o vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404":
          description: "`lista_nao_encontrada` ou `video_nao_encontrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      summary: Tirar vídeo da lista (dono e mentor)
      description: O vídeo continua na biblioteca de quem o enviou, ainda compartilhado.
      operationId: tirarVideoLista
      tags: [curadoria]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista sem o vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/videos:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Biblioteca de vídeos
      description: >
        Os vídeos do usuário no workspace e os que dono e mentores
        compartilharam com a turma, dos mais novos para os mais antigos (até
        500). Com `produto_id`, só os ligados ao produto, na ordem em que
        foram ligados.
      operationId: listarVideos
      tags: [midia]
      security: [{ bearer: [] }]
      parameters:
        - name: produto_id
          in: query
          schema: { type: string, format: uuid }
        - name: meus
          in: query
          description: Só os vídeos do próprio usuário
          schema: { type: boolean }
      responses:
        "200":
          description: Vídeos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/videos/cota:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Espaço de vídeos do workspace
      description: Bytes de upload usados (inclui envios em andamento) e o limite do plano.
      operationId: cotaVideos
      tags: [midia]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Cota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CotaVideos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/videos/embed:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Colar link de vídeo de referência
      description: >
        Aceita links do YouTube (vídeos e Shorts) e do TikTok, inclusive os
        curtos. A API resolve pelo oEmbed oficial (com cache de um dia) e
        guarda só título, autor, miniatura e URL; o vídeo toca no player da
        plataforma. Colar de novo o mesmo vídeo devolve o existente (200). O
        job `revalidar_embed` confere o vídeo a cada 7 dias e o marca como
        `indisponivel` se ele sumir.
      operationId: colarVideo
      tags: [midia]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 2000 }
                produto_id: { type: string, format: uuid, description: Liga o vídeo a este produto }
      responses:
        "200":
          description: O vídeo já estava na biblioteca
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "201":
          description: Vídeo guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404":
          description: "`produto_nao_encontrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`link_video_invalido` ou `video_indisponivel`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "502":
          description: "`plataforma_indisponivel`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/videos/uploads:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Iniciar upload de vídeo próprio
      description: >
        Valida o arquivo (MP4, MOV ou WebM, até 1 GB), exige a declaração de
        direito de uso, reserva o espaço na cota do plano e abre um upload
        multipart no bucket. O navegador envia as partes direto ao bucket
        pelas URLs de `POST .../partes` e termina com `POST .../concluir`. Um
        envio que não termina em 24 h é descartado (job `limpar_upload`).
      operationId: iniciarUploadVideo
      tags: [midia]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, content_type, tamanho, direito_uso]
              additionalProperties: false
              properties:
                nome: { type: string, description: Nome do arquivo }
                content_type: { type: string, enum: [video/mp4, video/quicktime, video/webm] }
                tamanho: { type: integer, format: int64, minimum: 1, maximum: 1073741824 }
                direito_uso: { type: boolean, description: "Declaração \"tenho direito de uso\" (precisa ser true)" }
                produto_id: { type: string, format: uuid, description: Liga o vídeo a este produto }
      responses:
        "201":
          description: Upload aberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadIniciado" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`cota_videos`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`direito_uso_obrigatorio`, `formato_invalido`, `arquivo_grande` ou `dados_invalidos`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503":
          description: "`uploads_indisponiveis` (servidor sem bucket)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/videos/{videoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    get:
      summary: Ver vídeo
      operationId: verVideo
      tags: [midia]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Renomear ou compartilhar (só quem enviou)
      description: >
        `compartilhado` mostra o vídeo para todo o workspace; só dono e
        mentores de uma mentoria compartilham.
      operationId: editarVideo
      tags: [midia]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                titulo: { type: string, maxLength: 200 }
                compartilhado: { type: boolean }
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      summary: Apagar vídeo (só quem enviou)
      description: >
        Apaga os arquivos do bucket (ou cancela o envio em andamento), os
        vínculos com produtos e listas, e devolve o espaço à cota.
      operationId: apagarVideo
      tags: [midia]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Apagado }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/partes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    get:
      summary: Partes já enviadas (para retomar o upload)
      operationId: partesUploadVideo
      tags: [midia]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Partes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParteUpload" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`upload_encerrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    post:
      summary: Assinar a URL de envio de uma parte
      description: >
        Devolve uma URL pré-assinada (PUT, válida por 1 hora) para o
        navegador enviar a parte direto ao bucket. As partes têm pelo menos
        5 MB, menos a última.
      operationId: assinarParteVideo
      tags: [midia]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numero]
              additionalProperties: false
              properties:
                numero: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: URL assinada
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`upload_encerrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/concluir:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    post:
      summary: Concluir upload
      description: >
        Junta as partes, confere o tamanho com o que foi reservado e põe o
        vídeo na fila do `processar_video` (ffmpeg: duração, miniatura e
        prévia em 720p). Um arquivo maior do que o informado é descartado.
      operationId: concluirUploadVideo
      tags: [midia]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partes]
              additionalProperties: false
              properties:
                partes:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items: { $ref: "#/components/schemas/ParteUpload" }
      responses:
        "200":
          description: Vídeo em processamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`upload_encerrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`upload_incompleto` ou `dados_invalidos`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/download:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    get:
      summary: Baixar o arquivo original
      description: >
        URL assinada de 5 minutos que baixa o arquivo enviado (o próprio ou
        um compartilhado com a turma). Vídeos de referência não são baixados.
      operationId: baixarVideo
      tags: [midia]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: URL de download
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`video_nao_pronto`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/produtos/{produtoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
      - name: produtoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Ligar vídeo a um produto (só quem enviou)
      description: >
        O vídeo aparece no produto (radar, coleção e listas) para o dono e,
        se compartilhado, para a turma.
      operationId: vincularVideoProduto
      tags: [midia]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
    delete:
      summary: Tirar vídeo do produto (só quem enviou)
      operationId: desvincularVideoProduto
      tags: [midia]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/notificacoes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Caixa de notificações do usuário no workspace
      description: As 50 mais recentes e o total de não lidas.
      operationId: caixaNotificacoes
      tags: [notificacoes]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Caixa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaixaNotificacoes" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/notificacoes/lidas:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Marcar todas como lidas
      operationId: marcarTodasLidas
      tags: [notificacoes]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Marcadas }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/notificacoes/{notificacaoId}/lida:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: notificacaoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Marcar como lida
      operationId: marcarLida
      tags: [notificacoes]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Marcada }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/eu/notificacoes:
    get:
      summary: Preferências de notificação
      operationId: preferenciasNotificacao
      tags: [notificacoes]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Preferências
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenciasNotificacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    put:
      summary: Ligar ou desligar os e-mails
      operationId: definirPreferenciasNotificacao
      tags: [notificacoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: boolean }
      responses:
        "200":
          description: Preferências
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenciasNotificacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/eu/push:
    post:
      summary: Inscrever este navegador no Web Push
      description: >
        Recebe o `PushSubscription.toJSON()` do navegador. Só aceita
        endpoints dos serviços de push dos navegadores (Google, Mozilla,
        Microsoft e Apple).
      operationId: inscreverPush
      tags: [notificacoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InscricaoPush" }
      responses:
        "204": { description: Inscrito }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "409":
          description: "`inscricoes_demais`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: "`inscricao_invalida`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503":
          description: "`push_indisponivel` (servidor sem chaves VAPID)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      summary: Cancelar o Web Push deste navegador
      operationId: desinscreverPush
      tags: [notificacoes]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "204": { description: Cancelado }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /v1/eu/resultados/sincronizacao:
    get:
      summary: Situação da sincronização de conversões do usuário
      operationId: verSincronizacao
      tags: [resultados]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Situação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sincronizacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /v1/eu/resultados/sincronizar:
    post:
      summary: Sincronizar as conversões agora
      description: >
        Enfileira a leitura do conversionReport da Shopee (últimos 89 dias) com
        a credencial do usuário. A sincronização também roda uma vez por dia.
        Se uma já está em andamento, devolve a situação dela.
      operationId: sincronizarResultados
      tags: [resultados]
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Sincronização pedida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sincronizacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "409":
          description: "`sem_credencial`: a Shopee não está conectada"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429":
          description: "`sincronizado_agora`: a última terminou há menos de 10 minutos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/resultados:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/De"
      - $ref: "#/components/parameters/Ate"
    get:
      summary: Os resultados do próprio usuário no workspace
      description: >
        Pedidos e comissão das vendas pelos links do usuário marcados com este
        workspace (no workspace pessoal, também as vendas por links de fora
        do app). A Open API da Shopee não informa cliques.
      operationId: meusResultados
      tags: [resultados]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeusResultados" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/resultados/turma:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/De"
      - $ref: "#/components/parameters/Ate"
    get:
      summary: Resultados agregados da turma (dono e mentor)
      description: >
        Somas dos membros que consentiram, no total, por dia, por lista da
        curadoria e por produto. Nunca há números por afiliado. Por lista,
        contam as vendas dos produtos importados da lista, por quem os
        importou, depois da importação.
      operationId: resultadosTurma
      tags: [resultados]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Resultados da turma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadosTurma" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`so_mentoria`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/resultados/consentimento:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      summary: Autorizar ou não o mentor a ver os meus resultados agregados
      operationId: definirConsentimento
      tags: [resultados]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Consentimento" }
      responses:
        "200":
          description: Consentimento gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consentimento" }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`so_mentoria`: o consentimento vale só em mentorias"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/webhooks/cobranca:
    post:
      summary: Aviso de cobrança do gateway (webhook)
      description: >
        Recebe os avisos do gateway de cobrança (Asaas em produção). Não usa o
        token do app: a autenticidade vem do segredo do provedor, no cabeçalho
        que ele manda. Um pagamento confirmado estende o acesso do workspace;
        um estorno o suspende na hora. Reenvios do mesmo aviso não fazem nada.
      operationId: webhookCobranca
      tags: [assinatura]
      security: []
      requestBody:
        required: true
        description: Corpo no formato do provedor.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204": { description: Aviso processado (ou sem efeito) }
        "401":
          description: "`nao_autenticado`: o aviso não veio do gateway"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "500": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/assinatura:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: A assinatura do workspace (dono e mentor)
      description: >
        Plano, preço, assentos e situação do acesso. Continua acessível com o
        workspace suspenso: é por aqui que ele volta.
      operationId: verAssinatura
      tags: [assinatura]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Assinatura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assinatura" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
    post:
      summary: Contratar o plano (só o dono)
      description: >
        Abre a assinatura mensal no gateway e devolve a fatura em aberto, que
        quem paga quita por PIX, boleto ou cartão. O acesso só é liberado
        quando o pagamento é confirmado.
      operationId: assinar
      tags: [assinatura]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovaAssinatura" }
      responses:
        "201":
          description: Assinatura criada, aguardando pagamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assinatura" }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`ja_assinada`, `assentos_em_uso`, `sem_preco`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
        "502":
          description: "`cobranca_indisponivel`: o gateway não respondeu"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    patch:
      summary: Mudar os assentos da mentoria (só o dono)
      description: >
        Diminuir vale na hora, e nunca abaixo dos assentos em uso (afiliados
        mais convites pendentes). Aumentar vale quando o próximo pagamento for
        confirmado; a cobrança em aberto já sai com o novo valor.
      operationId: mudarAssentos
      tags: [assinatura]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assentos]
              properties:
                assentos: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Assinatura atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assinatura" }
        "400": { $ref: "#/components/responses/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404":
          description: "`sem_assinatura`, `workspace_nao_encontrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "409":
          description: "`assentos_em_uso`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
        "502":
          description: "`cobranca_indisponivel`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      summary: Cancelar a assinatura (só o dono)
      description: >
        Encerra a cobrança no gateway. O acesso continua até o fim do período
        já pago.
      operationId: cancelarAssinatura
      tags: [assinatura]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Assinatura cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assinatura" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404":
          description: "`sem_assinatura`, `workspace_nao_encontrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "502":
          description: "`cobranca_indisponivel`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/workspaces/{workspaceId}/assinatura/simular-pagamento:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Simular o pagamento (só no ambiente local)
      description: >
        Confirma a cobrança em aberto sem gateway de verdade. Existe apenas
        quando a cobrança está em modo mock (`simulavel` na assinatura); fora
        dele devolve 404.
      operationId: simularPagamento
      tags: [assinatura]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Pagamento aplicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assinatura" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso do Zitadel (OIDC).
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListaId:
      name: listaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenConvite:
      name: token
      in: path
      required: true
      schema: { type: string }
    De:
      name: de
      in: query
      description: Primeiro dia (AAAA-MM-DD, fuso de Brasília). Padrão, 29 dias antes de `ate`.
      schema: { type: string, format: date }
    Ate:
      name: ate
      in: query
      description: Último dia, inclusive (AAAA-MM-DD). Padrão, hoje. O período tem até 366 dias.
      schema: { type: string, format: date }
  responses:
    NaoAutenticado:
      description: Sem token ou token inválido (`nao_autenticado`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Erro:
      description: Erro com código e mensagem para o usuário
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
  schemas:
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          description: >
            Código estável para o front. Em auth (provedor interno):
            invalid_credentials, email_taken, invalid_email, invalid_name,
            weak_password, invalid_auth_token, too_many_attempts. Em contas: nao_autenticado,
            dados_invalidos, json_invalido, sem_permissao,
            workspace_nao_encontrado, membro_nao_encontrado,
            convite_nao_encontrado, so_mentoria, dono_nao_sai, sem_assentos,
            ja_membro, convite_expirado, convite_usado, convite_revogado,
            convite_outro_email, workspace_suspenso, assentos_em_uso,
            erro_interno. Em assinatura: ja_assinada, sem_assinatura,
            sem_preco, cobranca_indisponivel. Em shopee: credencial_invalida,
            shopee_limite, shopee_indisponivel. Em radar: produto_nao_encontrado.
            Em coleções: item_nao_encontrado, colecao_nao_encontrada,
            colecao_existente, link_invalido, link_curto, sem_credencial,
            importacao_indisponivel. Em curadoria: lista_nao_encontrada,
            item_lista_nao_encontrado, limite_listas, lista_vazia, ja_na_lista,
            lista_cheia, lista_nao_publicada. Em notificações:
            notificacao_nao_encontrada, push_indisponivel, inscricao_invalida,
            inscricoes_demais. Em mídia: video_nao_encontrado,
            link_video_invalido, video_indisponivel, plataforma_indisponivel,
            direito_uso_obrigatorio, formato_invalido, arquivo_grande,
            cota_videos, uploads_indisponiveis, upload_encerrado,
            upload_incompleto, video_nao_pronto.
        mensagem: { type: string, description: Texto pronto para mostrar ao usuário }
    Assinatura:
      type: object
      required:
        [plano, situacao, acesso_ate, status, provedor, preco_centavos,
         assentos, assentos_em_uso, assentos_maximo, valor_centavos,
         proximo_ciclo, url_pagamento, simulavel]
      properties:
        plano: { type: string, enum: [avulso, mentoria] }
        situacao: { $ref: "#/components/schemas/SituacaoWorkspace" }
        acesso_ate:
          type: string
          format: date-time
          description: Até quando o workspace pode ser usado (fim do teste ou do ciclo pago, mais a tolerância).
        status:
          type: string
          enum: [sem_assinatura, aguardando, ativa, atrasada, cancelada]
        provedor: { type: string, description: "Gateway de cobrança (ex.: asaas); vazio sem assinatura." }
        preco_centavos:
          type: integer
          description: >
            Preço mensal do plano: do workspace no avulso, de cada assento na
            mentoria.
        assentos: { type: integer, description: Assentos contratados (0 sem assinatura). }
        assentos_em_uso: { type: integer, description: Afiliados mais convites pendentes. }
        assentos_maximo: { type: integer, description: Teto do plano. }
        valor_centavos: { type: integer, description: Total mensal da assinatura. }
        proximo_ciclo:
          type: [string, "null"]
          format: date
          description: Vencimento da cobrança em aberto (ou da próxima).
        url_pagamento:
          type: [string, "null"]
          description: Fatura em aberto no gateway (PIX, boleto ou cartão).
        simulavel:
          type: boolean
          description: >
            Ambiente local com cobrança em modo mock: a tela pode oferecer
            simular o pagamento.
    NovaAssinatura:
      type: object
      required: [cpf_cnpj]
      properties:
        assentos:
          type: integer
          minimum: 1
          description: Assentos da mentoria. Ignorado no plano avulso.
        cpf_cnpj: { type: string, description: CPF ou CNPJ de quem paga, exigido pelo gateway. }
    SituacaoWorkspace:
      type: string
      enum: [teste, ativo, gratuito, suspenso]
      description: >
        `teste` no período de avaliação, `ativo` com a assinatura paga,
        `gratuito` no workspace pessoal de quem é aluno de uma mentoria em dia
        (não é cobrado, por enquanto) e `suspenso` quando o acesso venceu. Suspenso, o workspace só permite ver
        a si mesmo, sair dele, mexer no consentimento e cuidar da assinatura;
        o resto devolve 402 `workspace_suspenso`.
    Usuario:
      type: object
      required: [id, nome, email, email_verificado, criado_em]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        email_verificado:
          type: boolean
          description: >
            Convites por e-mail e avisos por e-mail exigem o e-mail confirmado.
        criado_em: { type: string, format: date-time }
    AuthRegister:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    AuthLogin:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthToken:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string }
    AuthSession:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Token opaco da sessão, enviado como Bearer.
        expires_at:
          type: string
          format: date-time
          description: A validade é renovada a cada uso.
    Papel:
      type: string
      enum: [dono, mentor, afiliado]
    Workspace:
      type: object
      required: [id, tipo, nome, foto_url, plano, status, acesso_ate, assentos, papel, criado_em]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [pessoal, mentoria] }
        nome: { type: string }
        foto_url: { type: [string, "null"] }
        plano: { type: string, enum: [avulso, mentoria] }
        status: { $ref: "#/components/schemas/SituacaoWorkspace" }
        acesso_ate: { type: string, format: date-time }
        assentos:
          type: [integer, "null"]
          description: Assentos contratados na mentoria; nulo enquanto não há pagamento.
        papel: { $ref: "#/components/schemas/Papel" }
        criado_em: { type: string, format: date-time }
    Membro:
      type: object
      required: [usuario_id, nome, email, papel, entrou_em, consente_resultados]
      properties:
        usuario_id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        papel: { $ref: "#/components/schemas/Papel" }
        entrou_em: { type: string, format: date-time }
        consente_resultados:
          type: boolean
          description: Se o membro autoriza ver os seus resultados agregados no painel da turma.
    Convite:
      type: object
      required: [id, email, expira_em, criado_em]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }
        expira_em: { type: string, format: date-time }
        criado_em: { type: string, format: date-time }
    ConviteCriado:
      allOf:
        - $ref: "#/components/schemas/Convite"
        - type: object
          required: [token, url]
          properties:
            token: { type: string, description: Só aparece na criação }
            url: { type: string, format: uri, description: "Link para enviar ao afiliado ({APP_URL}/convite/{token})" }
            email_enviado:
              type: boolean
              description: Só em convites com e-mail. Falso quando o e-mail não saiu (o link continua valendo).
    ConvitePublico:
      type: object
      required: [workspace_nome, workspace_foto_url, status, expira_em]
      properties:
        workspace_nome: { type: string }
        workspace_foto_url: { type: [string, "null"] }
        status: { type: string, enum: [valido, expirado, usado, revogado] }
        expira_em: { type: string, format: date-time }
    ConexaoShopee:
      type: object
      required: [status, app_id, verificado_em]
      properties:
        status:
          type: string
          enum: [desconectado, conectado, invalido, expirado]
          description: >
            `invalido`: a Shopee recusou a assinatura (Secret trocado).
            `expirado`: a Shopee negou acesso à conta (bloqueada, sem permissão).
        app_id: { type: [string, "null"], description: "AppID mascarado, ex.: ••••5678" }
        verificado_em: { type: [string, "null"], format: date-time }
    Categoria:
      type: object
      required: [id, nome, produtos]
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        produtos: { type: integer }
    RadarItem:
      type: object
      required: [produto_id, nome, imagem_url, loja_nome, url, categorias, preco_min_centavos, preco_max_centavos, comissao_bp, ganho_por_venda_centavos, vendas, nota, score, vendas_7d, atualizado_em]
      properties:
        produto_id: { type: string, format: uuid }
        nome: { type: string }
        imagem_url: { type: [string, "null"] }
        loja_nome: { type: string }
        url: { type: string, description: Página do produto na Shopee (sem link de afiliado) }
        categorias: { type: array, items: { type: integer, format: int64 } }
        preco_min_centavos: { type: integer, format: int64 }
        preco_max_centavos: { type: integer, format: int64 }
        comissao_bp: { type: integer, description: "Comissão em basis points (1% = 100)" }
        ganho_por_venda_centavos: { type: integer, format: int64, description: preço mínimo × comissão }
        vendas: { type: integer, format: int64, description: Vendas acumuladas informadas pela Shopee }
        nota: { type: [number, "null"] }
        score: { type: number, description: "Score de tendência de 0 a 100, relativo ao catálogo" }
        vendas_7d:
          type: [integer, "null"]
          format: int64
          description: Crescimento de vendas estimado para 7 dias. Nulo quando ainda não há um dia de histórico.
        atualizado_em: { type: string, format: date-time, description: Coleta mais recente do produto }
    RadarPagina:
      type: object
      required: [itens, total, pagina, por_pagina, atualizado_em]
      properties:
        itens: { type: array, items: { $ref: "#/components/schemas/RadarItem" } }
        total: { type: integer }
        pagina: { type: integer }
        por_pagina: { type: integer }
        atualizado_em:
          type: [string, "null"]
          format: date-time
          description: Coleta mais recente do catálogo, para o "atualizado há X"
    Snapshot:
      type: object
      required: [coletado_em, preco_min_centavos, preco_max_centavos, comissao_bp, vendas, nota]
      properties:
        coletado_em: { type: string, format: date-time }
        preco_min_centavos: { type: integer, format: int64 }
        preco_max_centavos: { type: integer, format: int64 }
        comissao_bp: { type: integer }
        vendas: { type: integer, format: int64 }
        nota: { type: [number, "null"] }
    RadarDetalhe:
      type: object
      required: [produto, historico]
      properties:
        produto: { $ref: "#/components/schemas/RadarItem" }
        historico: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
    StatusItem:
      type: string
      enum: [testando, campeao, descartado]
    Canal:
      type: string
      enum: [instagram, tiktok, whatsapp, outro]
    ProdutoResumo:
      type: object
      required: [id, nome, imagem_url, loja_nome, url, preco_min_centavos, preco_max_centavos, comissao_bp, ganho_por_venda_centavos, vendas, nota, atualizado_em]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        imagem_url: { type: [string, "null"] }
        loja_nome: { type: string }
        url: { type: string, description: Página do produto na Shopee (sem link de afiliado) }
        preco_min_centavos: { type: integer, format: int64 }
        preco_max_centavos: { type: integer, format: int64 }
        comissao_bp: { type: integer }
        ganho_por_venda_centavos: { type: integer, format: int64 }
        vendas: { type: integer, format: int64 }
        nota: { type: [number, "null"] }
        atualizado_em: { type: string, format: date-time }
    LinkCanal:
      type: object
      required: [canal, sub_id, url]
      properties:
        canal: { $ref: "#/components/schemas/Canal" }
        sub_id: { type: string, description: "subIds enviados à Shopee, separados por vírgula" }
        url: { type: string }
    Item:
      type: object
      required: [id, produto, titulo, descricao, notas, tags, status, link_afiliado, link_origem, link_status, links, colecao_ids, criado_em, atualizado_em]
      properties:
        id: { type: string, format: uuid }
        produto: { $ref: "#/components/schemas/ProdutoResumo" }
        titulo: { type: string, description: Título próprio; vazio usa o nome do produto }
        descricao: { type: string }
        notas: { type: string, description: Notas pessoais; só o próprio usuário vê }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/StatusItem" }
        link_afiliado:
          type: [string, "null"]
          description: Link principal (o manual, ou o automático do canal `outro`)
        link_origem: { type: string, enum: [auto, manual] }
        link_status:
          type: string
          enum: [pendente, gerando, pronto, falhou]
          description: >
            `pendente`: sem credencial da Shopee conectada. `gerando`: o job
            `gerar_link` vai rodar. `falhou`: a Shopee não gerou o link
            depois das tentativas.
        links:
          type: array
          description: Links automáticos por canal (subId)
          items: { $ref: "#/components/schemas/LinkCanal" }
        colecao_ids: { type: array, items: { type: string, format: uuid } }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    ItensPagina:
      type: object
      required: [itens, total, pagina, por_pagina]
      properties:
        itens: { type: array, items: { $ref: "#/components/schemas/Item" } }
        total: { type: integer }
        pagina: { type: integer }
        por_pagina: { type: integer }
    Colecao:
      type: object
      required: [id, nome, itens, criado_em]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        itens: { type: integer, description: Quantidade de itens }
        criado_em: { type: string, format: date-time }
    Lista:
      type: object
      required: [id, titulo, descricao, publicada_em, criado_em, atualizado_em, produtos, importei]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descricao: { type: string }
        publicada_em: { type: [string, "null"], format: date-time, description: Nula enquanto é rascunho }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        produtos: { type: integer }
        importadores: { type: integer, description: Membros que importaram algum produto (só para dono e mentor) }
        importei: { type: boolean, description: Se quem vê já importou algum produto da lista }
    MeuItem:
      type: object
      description: O produto na coleção de quem vê a lista, com o link de afiliado dele
      required: [id, link_afiliado, link_origem, link_status, links, titulo, descricao]
      properties:
        id: { type: string, format: uuid }
        link_afiliado: { type: [string, "null"] }
        link_origem: { type: string, enum: [auto, manual] }
        link_status: { type: string, enum: [pendente, gerando, pronto, falhou] }
        links: { type: array, items: { $ref: "#/components/schemas/LinkCanal" } }
        titulo: { type: string }
        descricao: { type: string }
    ItemLista:
      type: object
      required: [produto, comentario, ordem, meu_item, videos]
      properties:
        produto: { $ref: "#/components/schemas/ProdutoResumo" }
        comentario: { type: string }
        ordem: { type: integer }
        importadores: { type: integer, description: Membros que importaram este produto (só para dono e mentor) }
        meu_item:
          oneOf:
            - $ref: "#/components/schemas/MeuItem"
            - type: "null"
        videos:
          type: array
          description: Vídeos do produto que quem vê enxerga (os dele e os compartilhados)
          items: { $ref: "#/components/schemas/Video" }
    ListaDetalhe:
      allOf:
        - $ref: "#/components/schemas/Lista"
        - type: object
          required: [itens, videos]
          properties:
            itens: { type: array, items: { $ref: "#/components/schemas/ItemLista" } }
            videos:
              type: array
              description: Vídeos anexados à lista pelo mentor
              items: { $ref: "#/components/schemas/Video" }
    ResultadoImportacao:
      type: object
      required: [criados, ja_salvos, colecao_id, link_status]
      properties:
        criados: { type: integer }
        ja_salvos: { type: integer }
        colecao_id: { type: [string, "null"], format: uuid }
        link_status:
          type: string
          enum: [pendente, gerando, falhou]
          description: Situação dos links dos itens novos
    PainelLista:
      type: object
      required: [afiliados, importadores]
      properties:
        afiliados: { type: integer, description: Afiliados no workspace }
        importadores:
          type: array
          items:
            type: object
            required: [usuario_id, nome, produtos, ultima_em]
            properties:
              usuario_id: { type: string, format: uuid }
              nome: { type: string }
              produtos: { type: integer }
              ultima_em: { type: string, format: date-time }
    Notificacao:
      type: object
      required: [id, tipo, titulo, corpo, url, criado_em, lida_em]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, description: "ex.: lista_publicada" }
        titulo: { type: string }
        corpo: { type: string }
        url: { type: string, description: "Caminho no app, ex.: /w/{workspaceId}/listas/{listaId}" }
        criado_em: { type: string, format: date-time }
        lida_em: { type: [string, "null"], format: date-time }
    CaixaNotificacoes:
      type: object
      required: [notificacoes, nao_lidas]
      properties:
        notificacoes: { type: array, items: { $ref: "#/components/schemas/Notificacao" } }
        nao_lidas: { type: integer }
    PreferenciasNotificacao:
      type: object
      required: [email, push_chave_publica, inscricoes]
      properties:
        email: { type: boolean, description: Receber as notificações por e-mail }
        push_chave_publica:
          type: [string, "null"]
          description: Chave VAPID para o navegador se inscrever; nula sem Web Push no servidor
        inscricoes: { type: integer, description: Navegadores inscritos no Web Push }
    InscricaoPush:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 1000 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
    Video:
      type: object
      required: [id, tipo, plataforma, status, titulo, autor, url, player_url, thumb_url, preview_url, duracao_s, largura, altura, tamanho_bytes, nome_arquivo, compartilhado, meu, produto_ids, lista_ids, criado_em]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [embed, upload]
          description: "`embed`: referência de outro criador (só metadados). `upload`: vídeo próprio."
        plataforma: { type: string, enum: [youtube, tiktok, upload] }
        status:
          type: string
          enum: [enviando, processando, pronto, falhou, indisponivel]
          description: >
            `enviando`: upload em andamento. `processando`: na fila do ffmpeg.
            `falhou`: o arquivo não pôde ser lido como vídeo.
            `indisponivel`: o vídeo de referência sumiu da plataforma.
        titulo: { type: string }
        autor: { type: string, description: Autor no YouTube ou no TikTok (embed) }
        url: { type: [string, "null"], description: Página do vídeo na plataforma (embed) }
        player_url: { type: [string, "null"], description: Player oficial da plataforma, para iframe (embed) }
        thumb_url:
          type: [string, "null"]
          description: Miniatura da plataforma (embed) ou gerada pelo worker (upload pronto, URL assinada)
        preview_url: { type: [string, "null"], description: Prévia em 720p do upload pronto (URL assinada de 6 horas) }
        duracao_s: { type: [integer, "null"] }
        largura: { type: [integer, "null"], description: Da prévia, na orientação de exibição }
        altura: { type: [integer, "null"] }
        tamanho_bytes: { type: integer, format: int64 }
        nome_arquivo: { type: [string, "null"] }
        compartilhado: { type: boolean, description: Visível para todo o workspace }
        meu: { type: boolean, description: Se quem vê é quem enviou }
        produto_ids:
          type: array
          description: Produtos ligados (só nos vídeos do próprio usuário)
          items: { type: string, format: uuid }
        lista_ids:
          type: array
          description: Listas em que está anexado (só nos vídeos do próprio usuário)
          items: { type: string, format: uuid }
        criado_em: { type: string, format: date-time }
    UploadIniciado:
      type: object
      required: [video, upload_id, chave]
      properties:
        video: { $ref: "#/components/schemas/Video" }
        upload_id: { type: string, description: Id do upload multipart no bucket }
        chave: { type: string, description: Chave do objeto no bucket }
    ParteUpload:
      type: object
      required: [numero, etag]
      properties:
        numero: { type: integer, minimum: 1, maximum: 10000 }
        etag: { type: string, description: ETag que o bucket devolveu no PUT da parte }
        tamanho: { type: integer, format: int64 }
    CotaVideos:
      type: object
      required: [usados_bytes, limite_bytes]
      properties:
        usados_bytes: { type: integer, format: int64 }
        limite_bytes: { type: integer, format: int64 }
    Sincronizacao:
      type: object
      required: [status, pedida_em, atualizado_em, conversoes, erro]
      properties:
        status: { type: string, enum: [nunca, sincronizando, ok, erro, sem_credencial] }
        pedida_em: { type: [string, "null"], format: date-time }
        atualizado_em:
          type: [string, "null"]
          format: date-time
          description: Fim da última sincronização que deu certo.
        conversoes: { type: integer, description: Itens de pedido lidos na última sincronização. }
        erro: { type: [string, "null"] }
    Consentimento:
      type: object
      required: [consente]
      additionalProperties: false
      properties:
        consente: { type: boolean }
    Periodo:
      type: object
      required: [de, ate]
      properties:
        de: { type: string, format: date }
        ate: { type: string, format: date }
    TotaisResultados:
      type: object
      description: >
        Dinheiro em centavos. Pedidos e itens não contam os cancelados.
        Comissão estimada soma os pedidos não cancelados; validada, os
        concluídos.
      required: [pedidos, cancelados, itens, vendas_centavos, comissao_estimada_centavos, comissao_validada_centavos]
      properties:
        pedidos: { type: integer, format: int64 }
        cancelados: { type: integer, format: int64 }
        itens: { type: integer, format: int64 }
        vendas_centavos: { type: integer, format: int64 }
        comissao_estimada_centavos: { type: integer, format: int64 }
        comissao_validada_centavos: { type: integer, format: int64 }
    ResultadoDia:
      type: object
      required: [dia, pedidos, comissao_estimada_centavos, comissao_validada_centavos]
      properties:
        dia: { type: string, format: date }
        pedidos: { type: integer, format: int64 }
        comissao_estimada_centavos: { type: integer, format: int64 }
        comissao_validada_centavos: { type: integer, format: int64 }
    ResultadoProduto:
      type: object
      required: [item_id, produto_id, nome, loja_nome, imagem_url, pedidos, itens, vendas_centavos, comissao_estimada_centavos, comissao_validada_centavos]
      properties:
        item_id: { type: integer, format: int64 }
        produto_id:
          type: [string, "null"]
          format: uuid
          description: Produto do catálogo, quando o item está nele.
        nome: { type: string }
        loja_nome: { type: string }
        imagem_url: { type: [string, "null"] }
        pedidos: { type: integer, format: int64 }
        itens: { type: integer, format: int64 }
        vendas_centavos: { type: integer, format: int64 }
        comissao_estimada_centavos: { type: integer, format: int64 }
        comissao_validada_centavos: { type: integer, format: int64 }
    ResultadoCanal:
      type: object
      required: [canal, pedidos, comissao_estimada_centavos, comissao_validada_centavos]
      properties:
        canal:
          type: string
          enum: [instagram, tiktok, whatsapp, outro, ""]
          description: Vazio quando a venda veio de um link criado fora do app.
        pedidos: { type: integer, format: int64 }
        comissao_estimada_centavos: { type: integer, format: int64 }
        comissao_validada_centavos: { type: integer, format: int64 }
    ResultadoLista:
      type: object
      required: [id, titulo, publicada_em, importadores, pedidos, vendas_centavos, comissao_estimada_centavos, comissao_validada_centavos]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        publicada_em: { type: string, format: date-time }
        importadores: { type: integer, description: Quem da turma importou a lista (consentindo ou não). }
        pedidos: { type: integer, format: int64 }
        vendas_centavos: { type: integer, format: int64 }
        comissao_estimada_centavos: { type: integer, format: int64 }
        comissao_validada_centavos: { type: integer, format: int64 }
    MeusResultados:
      type: object
      required: [periodo, sincronizacao, consente, totais, por_dia, por_produto, por_canal]
      properties:
        periodo: { $ref: "#/components/schemas/Periodo" }
        sincronizacao: { $ref: "#/components/schemas/Sincronizacao" }
        consente:
          type: [boolean, "null"]
          description: Só em mentorias. Se o usuário mostra os resultados ao mentor.
        totais: { $ref: "#/components/schemas/TotaisResultados" }
        por_dia: { type: array, items: { $ref: "#/components/schemas/ResultadoDia" } }
        por_produto: { type: array, items: { $ref: "#/components/schemas/ResultadoProduto" } }
        por_canal: { type: array, items: { $ref: "#/components/schemas/ResultadoCanal" } }
    ResultadosTurma:
      type: object
      required: [periodo, afiliados, consentem, ativos, totais, por_dia, por_lista, por_produto]
      properties:
        periodo: { $ref: "#/components/schemas/Periodo" }
        afiliados: { type: integer, description: Afiliados do workspace. }
        consentem: { type: integer, description: Membros que autorizam ver os resultados. }
        ativos: { type: integer, format: int64, description: Dos que autorizam, quantos venderam no período. }
        totais: { $ref: "#/components/schemas/TotaisResultados" }
        por_dia: { type: array, items: { $ref: "#/components/schemas/ResultadoDia" } }
        por_lista: { type: array, items: { $ref: "#/components/schemas/ResultadoLista" } }
        por_produto: { type: array, items: { $ref: "#/components/schemas/ResultadoProduto" } }
    Prontidao:
      type: object
      additionalProperties:
        type: string
        enum: [ok, failed]
