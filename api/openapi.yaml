openapi: 3.1.0
info:
  title: App Parceiros API
  version: 0.2.0
  description: >
    Contrato da API do App Parceiros. É a fonte da verdade: altere aqui
    antes de implementar e gere os clientes a partir deste arquivo.


    Erros vêm sempre como `{code, message}` (schema `Error`): `code` é
    estável e serve para o programa; `message` já vem em português, pronta
    para mostrar ao usuário. O status segue o tipo do erro: 400 para JSON
    ou parâmetro malformado (`invalid_json`, `invalid_request`), 401 sem
    login, 402 workspace suspenso, 403 sem permissão, 404 não encontrado,
    409 conflito, 410 link vencido, 422 dado inválido, 429 limite de
    chamadas, 502 provedor externo fora do ar, 503 recurso não configurado
    no servidor e 500 `internal_error`.


    As rotas de um workspace ficam sob `/v1/workspaces/{workspaceId}`. Quem
    não é membro recebe 404 `workspace_not_found`. Com o workspace suspenso
    por falta de pagamento, só continuam valendo ver o workspace, sair dele
    (ou remover afiliados) e a assinatura; o resto responde 402
    (`workspace_suspended`, ou `workspace_suspended_owner` para o dono).
servers:
  - url: http://localhost:8080
tags:
  - { name: health, description: Verificações do processo }
  - { name: auth, description: "Provedor de identidade interno (só com AUTH_PROVIDER=internal)" }
  - { name: accounts, description: "Usuário, workspaces, membros e convites" }
  - { name: shopee, description: Conexão do usuário com a Open API de afiliados da Shopee }
  - { name: radar, description: Radar de produtos em alta }
  - { name: collections, description: Produtos salvos e coleções do usuário }
  - { name: curation, description: Listas da curadoria do mentor para a turma }
  - { name: media, description: Biblioteca de vídeos }
  - { name: notifications, description: "Caixa de notificações, preferências e Web Push" }
  - { name: results, description: "Resultados (conversões da Shopee), consentimento e sincronização" }
  - { name: billing, description: Assinatura do workspace e webhook do gateway }
paths:
  /healthz:
    get:
      summary: Verificação de vida do processo
      operationId: healthz
      tags: [health]
      security: []
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      summary: Verificação de prontidão (Postgres e Redis)
      operationId: readyz
      tags: [health]
      security: []
      responses:
        "200":
          description: Todas as dependências respondem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Alguma dependência falhou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  # --- auth (provedor interno) ---------------------------------------------
  /v1/auth/register:
    post:
      summary: Cria uma conta com e-mail e senha (provedor interno)
      description: >
        Só existe com AUTH_PROVIDER=internal. Cria a conta, manda o link de
        confirmação do e-mail e já abre uma sessão. O usuário e o workspace
        pessoal são criados no primeiro acesso autenticado (ex.: GET /v1/me),
        como em qualquer provedor.
      operationId: authRegister
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegister" }
      responses:
        "201":
          description: Conta criada e sessão aberta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "409":
          description: "`email_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_email`, `invalid_name` ou `weak_password`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`too_many_attempts`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/login:
    post:
      summary: Entra com e-mail e senha (provedor interno)
      operationId: authLogin
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLogin" }
      responses:
        "200":
          description: Sessão aberta. Use o token como Bearer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401":
          description: "`invalid_credentials`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`too_many_attempts` (por e-mail e por IP)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/logout:
    post:
      summary: Encerra a sessão do token (provedor interno)
      operationId: authLogout
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Sessão encerrada }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/email/verify:
    post:
      summary: Confirma o e-mail com o token do link enviado (provedor interno)
      operationId: authVerifyEmail
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthToken" }
      responses:
        "204": { description: E-mail confirmado }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "410":
          description: "`invalid_auth_token`: o link expirou ou já foi usado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/email/resend:
    post:
      summary: Manda de novo o link de confirmação do e-mail (provedor interno)
      operationId: authResendVerification
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: "Link enviado, ou e-mail já confirmado" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429":
          description: "`too_many_attempts`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/password/forgot:
    post:
      summary: Pede o link para redefinir a senha (provedor interno)
      description: >
        Responde 202 mesmo quando o e-mail não tem conta, para não revelar
        quem está cadastrado.
      operationId: authForgotPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthForgotPassword" }
      responses:
        "202": { description: Pedido recebido }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "429":
          description: "`too_many_attempts`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/password/reset:
    post:
      summary: Define uma nova senha com o token do link enviado (provedor interno)
      description: Encerra todas as sessões abertas da conta.
      operationId: authResetPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthResetPassword" }
      responses:
        "204": { description: Senha trocada }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "410":
          description: "`invalid_auth_token`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`weak_password`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- accounts ------------------------------------------------------------
  /v1/me:
    get:
      summary: Usuário autenticado
      description: >
        No primeiro acesso, cria o usuário a partir do perfil do provedor de
        identidade (Zitadel ou o provedor interno) e o seu workspace pessoal.
      operationId: getMe
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/workspaces:
    get:
      summary: Workspaces de que o usuário participa (seletor do topo)
      operationId: listWorkspaces
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspaces, o pessoal primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Criar mentoria
      description: Cria um workspace do tipo mentoria com o usuário como dono.
      operationId: createMentorship
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMentorship" }
      responses:
        "201":
          description: Mentoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: "`invalid_workspace_name` ou `invalid_photo_url`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Detalhe do workspace
      description: Continua valendo com o workspace suspenso.
      operationId: getWorkspace
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    patch:
      summary: Alterar nome e foto (só o dono)
      operationId: updateWorkspace
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspace" }
      responses:
        "200":
          description: Workspace atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "422":
          description: "`invalid_workspace_name` ou `invalid_photo_url`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Membros do workspace (dono e mentor)
      operationId: listMembers
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Membros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
  /v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Sair do workspace ou remover um membro
      description: >
        Com o próprio id, o usuário sai do workspace. Dono e mentor removem
        afiliados; só o dono remove mentores; o dono não sai nem é removido.
        Os dados pessoais do afiliado (coleção, credencial) continuam dele.
        Continua valendo com o workspace suspenso (para caber em menos
        assentos).
      operationId: removeMember
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Removido }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`member_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`owner_cannot_leave`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Convites pendentes (dono e mentor)
      operationId: listInvites
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Convites ainda válidos, sem o token
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      summary: Convidar afiliado (dono e mentor)
      description: >
        Gera um convite de uso único para um workspace de mentoria. Com
        e-mail, só a conta com aquele e-mail verificado pode aceitar, e o link
        também vai por e-mail (`email_sent`). Convites pendentes ocupam
        assento do plano. O token só aparece nesta resposta.
      operationId: createInvite
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvite" }
      responses:
        "201":
          description: Convite criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: "`mentorship_only` ou `no_seats`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_invite_email` ou `invalid_invite_validity`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: inviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Cancelar convite pendente (dono e mentor)
      operationId: revokeInvite
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Cancelado }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`invite_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/invites/{token}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      summary: Ver convite (público)
      description: Mostra o workspace e a situação do convite antes do login.
      operationId: viewInvite
      tags: [accounts]
      security: []
      responses:
        "200":
          description: Convite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicInvite" }
        "404":
          description: "`invite_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/invites/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    post:
      summary: Aceitar convite
      description: Torna o usuário afiliado do workspace do convite.
      operationId: acceptInvite
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspace em que o usuário entrou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`invite_other_email`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`invite_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`already_member` ou `no_seats`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: "`invite_expired`, `invite_used` ou `invite_revoked`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- shopee --------------------------------------------------------------
  /v1/me/shopee:
    get:
      summary: Situação da conexão com a Shopee
      description: >
        A credencial (AppID e Secret da Open API de afiliados) pertence ao
        usuário, não ao workspace. O Secret nunca aparece em resposta.
      operationId: getShopeeConnection
      tags: [shopee]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Situação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopeeConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      summary: Conectar a conta de afiliado
      description: >
        Valida o AppID e o Secret com uma chamada de teste à Shopee e guarda a
        credencial cifrada (envelope encryption). Substitui a credencial
        anterior, se houver.
      operationId: connectShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectShopee" }
      responses:
        "200":
          description: Conectado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopeeConnection" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: >
            `invalid_app_id`, `invalid_secret`, `invalid_shopee_credential`
            (a Shopee recusou o AppID ou o Secret) ou `shopee_access_denied`
            (a conta não tem acesso à Open API)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`shopee_rate_limited` (a Shopee limitou as chamadas; tente de novo em instantes)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`shopee_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Desconectar (apaga a credencial)
      operationId: disconnectShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Desconectado }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # --- radar ---------------------------------------------------------------
  /v1/workspaces/{workspaceId}/radar:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Radar de produtos em alta
      description: >
        Lista ranqueada do catálogo coletado pelo job `snapshot_catalog`
        (credencial do app) com o score do job `compute_trends`.
        Valores em centavos e comissão em basis points (1% = 100).
      operationId: getRadar
      tags: [radar]
      security: [{ bearer: [] }]
      parameters:
        - { name: category, in: query, description: Categoria de nível 1, schema: { type: integer, format: int64 } }
        - { name: min_price, in: query, description: Centavos, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: max_price, in: query, description: Centavos, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: min_commission, in: query, description: Basis points, schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { name: min_rating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: q, in: query, description: Busca no nome do produto e da loja, schema: { type: string, maxLength: 100 } }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/RadarSort" }
        - $ref: "#/components/parameters/Page"
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        "200":
          description: Página do radar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "422":
          description: >
            `invalid_page`, `invalid_per_page`, `negative_price`,
            `invalid_min_commission`, `invalid_min_rating`, `invalid_sort` ou
            `query_too_long`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/radar/categories:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Categorias presentes no radar (para o filtro)
      operationId: getRadarCategories
      tags: [radar]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Categorias, as com mais produtos primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RadarCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
  /v1/workspaces/{workspaceId}/radar/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProductId"
    get:
      summary: Detalhe do produto com histórico
      operationId: getRadarProduct
      tags: [radar]
      security: [{ bearer: [] }]
      parameters:
        - { name: days, in: query, description: Janela do histórico, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200":
          description: Produto e snapshots da janela, do mais antigo ao mais novo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`product_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_history_days`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- collections ---------------------------------------------------------
  /v1/workspaces/{workspaceId}/items:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Produtos salvos pelo usuário no workspace
      description: >
        A coleção é do usuário dentro do workspace. Ninguém mais a vê, nem o
        mentor. Os mais recentes primeiro.
      operationId: listItems
      tags: [collections]
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, description: Busca no título próprio e no nome do produto, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ItemStatus" } }
        - { name: collection, in: query, description: Só os itens desta coleção, schema: { type: string, format: uuid } }
        - { name: tag, in: query, schema: { type: string, maxLength: 30 } }
        - $ref: "#/components/parameters/Page"
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Página de itens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "422":
          description: "`invalid_item_page`, `query_too_long` ou `invalid_item_status`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Salvar produto
      description: >
        Salva um produto do radar (`product_id`) ou colado como link da Shopee
        (`url`); informe só um dos dois. Um produto que não está no catálogo
        é buscado na Shopee com a credencial do app. O link de afiliado é
        gerado em segundo plano (job `generate_affiliate_link`) com a
        credencial do usuário, um por canal. Sem credencial conectada, o item
        fica com `link_status` = `pending`. Salvar de novo o mesmo produto
        devolve o item existente (200).
      operationId: saveItem
      tags: [collections]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveItem" }
      responses:
        "200":
          description: O produto já estava salvo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "201":
          description: Salvo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`product_not_found` (nem no catálogo nem na Shopee) ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`product_or_link_required`, `invalid_product_link` ou `short_link`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`link_rate_limited` (a Shopee limitou as chamadas)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`product_lookup_failed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`import_unavailable` (o servidor não tem a credencial do app para buscar produtos fora do catálogo)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/items/products:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: IDs dos produtos já salvos (para marcar o radar)
      operationId: listSavedProducts
      tags: [collections]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: product_id de cada item salvo
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
  /v1/workspaces/{workspaceId}/items/pending-links:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Gerar os links que ficaram pendentes ou falharam
      description: Use depois de conectar a conta da Shopee. Itens com link manual não mudam.
      operationId: generatePendingLinks
      tags: [collections]
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Itens enfileirados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingLinks" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: "`no_credential` (conecte a conta da Shopee antes)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ItemId"
    get:
      summary: Detalhe do item
      operationId: getItem
      tags: [collections]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
    patch:
      summary: Editar título, descrição, notas, tags, status e link
      description: >
        Campos ausentes não mudam. Texto vazio apaga o campo. `affiliate_link`
        com uma URL grava um link manual, que tem prioridade sobre o
        automático; `null` volta ao link automático e gera de novo.
      operationId: updateItem
      tags: [collections]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItem" }
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
        "422":
          description: >
            `invalid_item_title`, `invalid_item_description`,
            `invalid_item_notes`, `invalid_tag`, `too_many_tags`,
            `invalid_item_status` ou `invalid_affiliate_link`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Remover o item (e os seus links)
      operationId: removeItem
      tags: [collections]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Removido }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
  /v1/workspaces/{workspaceId}/items/{itemId}/link:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ItemId"
    post:
      summary: Gerar o link automático de novo
      description: Descarta o link manual, se houver, e enfileira o job `generate_affiliate_link`.
      operationId: generateItemLink
      tags: [collections]
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Item com `link_status` = `generating`, ou `pending` sem credencial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
  /v1/workspaces/{workspaceId}/items/{itemId}/collections:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ItemId"
    put:
      summary: Definir as coleções do item
      description: Substitui a lista. Um item pode estar em várias coleções.
      operationId: setItemCollections
      tags: [collections]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetItemCollections" }
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`item_not_found`, `collection_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`too_many_item_collections`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/collections:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Coleções (pastas) do usuário no workspace
      operationId: listCollections
      tags: [collections]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Coleções em ordem alfabética
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      summary: Criar coleção
      operationId: createCollection
      tags: [collections]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionName" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: "`collection_exists`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_collection_name`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Renomear coleção
      operationId: renameCollection
      tags: [collections]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionName" }
      responses:
        "200":
          description: Renomeada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`collection_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`collection_exists`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_collection_name`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Apagar coleção
      description: Os itens continuam salvos; só saem da coleção.
      operationId: deleteCollection
      tags: [collections]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Apagada }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`collection_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- curation ------------------------------------------------------------
  /v1/workspaces/{workspaceId}/lists:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Listas da curadoria
      description: >
        Dono e mentor veem os rascunhos (primeiro) e as publicadas; os
        afiliados, só as publicadas. Das mais novas para as mais antigas.
      operationId: listCuratedLists
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Listas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CuratedList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      summary: Criar lista (dono e mentor)
      description: Cria um rascunho vazio num workspace de mentoria, dentro do limite de listas do plano.
      operationId: createCuratedList
      tags: [curation]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCuratedList" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: "`lists_mentorship_only` ou `list_limit`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_list_title` ou `invalid_list_description`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
    get:
      summary: Lista com os produtos
      description: >
        Cada produto que quem vê já tem na coleção vem em `my_item`, com o
        link de afiliado dele. Rascunhos dão 404 para afiliados.
      operationId: getCuratedList
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/ListNotFound" }
    patch:
      summary: Editar título e descrição (dono e mentor)
      description: Campos ausentes não mudam.
      operationId: updateCuratedList
      tags: [curation]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCuratedList" }
      responses:
        "200":
          description: Lista editada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }
        "422":
          description: "`invalid_list_title` ou `invalid_list_description`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Apagar lista (dono e mentor)
      description: O que os afiliados já importaram continua na coleção deles.
      operationId: deleteCuratedList
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Apagada }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }
  /v1/workspaces/{workspaceId}/lists/{listId}/items:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
    post:
      summary: Adicionar produto à lista (dono e mentor)
      description: >
        Do radar (`product_id`) ou colado como link da Shopee (`url`), como
        ao salvar na coleção. Entra no fim da lista. Até 100 produtos.
      operationId: addCuratedListItem
      tags: [curation]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCuratedListItem" }
      responses:
        "201":
          description: Lista com o produto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404":
          description: "`list_not_found`, `product_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`lists_mentorship_only`, `already_in_list` ou `list_full`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_list_comment`, `product_or_link_required`, `invalid_product_link` ou `short_link`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`link_rate_limited`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`product_lookup_failed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`import_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/lists/{listId}/items/{productId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
      - $ref: "#/components/parameters/ProductId"
    patch:
      summary: Trocar o comentário de um produto (dono e mentor)
      operationId: commentCuratedListItem
      tags: [curation]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCuratedListItem" }
      responses:
        "200":
          description: Lista atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/ListItemNotFound" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }
        "422":
          description: "`list_comment_required` ou `invalid_list_comment`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Tirar produto da lista (dono e mentor)
      operationId: removeCuratedListItem
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/ListItemNotFound" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }
  /v1/workspaces/{workspaceId}/lists/{listId}/order:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
    put:
      summary: Reordenar produtos (dono e mentor)
      description: Envie todos os produtos da lista, cada um uma vez, na nova ordem.
      operationId: reorderCuratedList
      tags: [curation]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderCuratedList" }
      responses:
        "200":
          description: Lista reordenada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }
        "422":
          description: "`invalid_list_order`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/lists/{listId}/publish:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
    post:
      summary: Publicar para a turma (dono e mentor)
      description: >
        Mostra a lista para todo o workspace e avisa cada membro, menos quem
        publicou, na caixa de notificações, por e-mail e por Web Push (job
        `deliver_notification`). Publicar de novo não avisa de novo.
      operationId: publishCuratedList
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409":
          description: "`lists_mentorship_only` ou `list_empty`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/lists/{listId}/import:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
    post:
      summary: Importar a lista para a minha coleção
      description: >
        Salva os produtos escolhidos (todos, se `product_ids` vier vazio) na
        coleção de quem importa, com o comentário do mentor nas notas. Os
        links saem com a credencial da Shopee do próprio usuário (job
        `generate_affiliate_link`); sem credencial, ficam pendentes. Com
        `collection` (padrão), os itens também vão para uma coleção com o
        nome da lista. Importar de novo só salva o que falta.
      operationId: importCuratedList
      tags: [curation]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCuratedList" }
      responses:
        "200":
          description: Resultado da importação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListImport" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409":
          description: "`list_not_published` ou `list_empty`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`product_not_in_list`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/lists/{listId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
    get:
      summary: Quem da turma importou a lista (dono e mentor)
      operationId: getCuratedListDashboard
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Painel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }
  /v1/workspaces/{workspaceId}/lists/{listId}/videos/{videoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ListId"
      - $ref: "#/components/parameters/VideoId"
    put:
      summary: Anexar vídeo à lista (dono e mentor)
      description: >
        Anexa um vídeo da biblioteca de quem edita a lista. O vídeo passa a
        ser compartilhado com a turma.
      operationId: attachCuratedListVideo
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista com o vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`list_managers_only`, `video_owner_only` ou `video_share_managers_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`list_not_found`, `video_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }
    delete:
      summary: Tirar vídeo da lista (dono e mentor)
      description: O vídeo continua na biblioteca de quem o enviou, ainda compartilhado.
      operationId: detachCuratedListVideo
      tags: [curation]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista sem o vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratedListDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403": { $ref: "#/components/responses/ListManagersOnly" }
        "404":
          description: "`list_not_found`, `video_not_found`, `video_not_in_list` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/ListsMentorshipOnly" }

  # --- media ---------------------------------------------------------------
  /v1/workspaces/{workspaceId}/videos:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Biblioteca de vídeos
      description: >
        Os vídeos do usuário no workspace e os que dono e mentores
        compartilharam com a turma, dos mais novos para os mais antigos. Com
        `product_id`, só os ligados ao produto, na ordem em que foram
        ligados.
      operationId: listVideos
      tags: [media]
      security: [{ bearer: [] }]
      parameters:
        - name: product_id
          in: query
          description: Um id malformado responde 404 `product_not_found`.
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          description: Só os vídeos do próprio usuário (só o valor `true` liga o filtro)
          schema: { type: boolean }
      responses:
        "200":
          description: Vídeos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`product_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/videos/quota:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Espaço de vídeos do workspace
      description: Bytes de upload usados (inclui envios em andamento) e o limite do plano.
      operationId: getVideoQuota
      tags: [media]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Cota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoQuota" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
  /v1/workspaces/{workspaceId}/videos/embed:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Colar link de vídeo de referência
      description: >
        Aceita links do YouTube (vídeos e Shorts) e do TikTok, inclusive os
        curtos. A API resolve pelo oEmbed oficial (com cache de um dia) e
        guarda só título, autor, miniatura e URL; o vídeo toca no player da
        plataforma. Colar de novo o mesmo vídeo devolve o existente (200). O
        job `revalidate_embed` confere o vídeo a cada 7 dias e o marca como
        `unavailable` se ele sumir.
      operationId: pasteVideo
      tags: [media]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasteVideo" }
      responses:
        "200":
          description: O vídeo já estava na biblioteca
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "201":
          description: Vídeo guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`product_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_video_link` ou `video_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`platform_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/videos/uploads:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Iniciar upload de vídeo próprio
      description: >
        Valida o arquivo (MP4, MOV ou WebM, até 1 GB), exige a declaração de
        direito de uso, reserva o espaço na cota do plano e abre um upload
        multipart no bucket. O navegador envia as partes direto ao bucket
        pelas URLs de `POST .../parts` e termina com `POST .../complete`. Um
        envio que não termina em 24 h é descartado (job `clean_upload`).
      operationId: startVideoUpload
      tags: [media]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartUpload" }
      responses:
        "201":
          description: Upload aberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartedUpload" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`product_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`video_quota_exceeded`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`usage_rights_required`, `invalid_video_format`, `invalid_video_size` ou `video_too_large`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`uploads_unavailable` (servidor sem bucket)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/videos/{videoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    get:
      summary: Ver vídeo
      operationId: getVideo
      tags: [media]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
    patch:
      summary: Renomear ou compartilhar (só quem enviou)
      description: >
        `shared` mostra o vídeo para todo o workspace; só dono e mentores de
        uma mentoria compartilham.
      operationId: updateVideo
      tags: [media]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVideo" }
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`video_owner_only` ou `video_share_managers_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "422":
          description: "`video_title_too_long`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Apagar vídeo (só quem enviou)
      description: >
        Apaga os arquivos do bucket (ou cancela o envio em andamento), os
        vínculos com produtos e listas, e devolve o espaço à cota.
      operationId: deleteVideo
      tags: [media]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Apagado }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`video_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "503":
          description: "`uploads_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/parts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    get:
      summary: Partes já enviadas (para retomar o upload)
      operationId: listVideoUploadParts
      tags: [media]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Partes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadPart" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`video_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "409":
          description: "`upload_closed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`uploads_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Assinar a URL de envio de uma parte
      description: >
        Devolve uma URL pré-assinada (PUT, válida por 1 hora) para o
        navegador enviar a parte direto ao bucket. As partes têm pelo menos
        5 MB, menos a última.
      operationId: signVideoUploadPart
      tags: [media]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignPart" }
      responses:
        "200":
          description: URL assinada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedURL" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`video_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "409":
          description: "`upload_closed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_part_number`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`uploads_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/complete:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    post:
      summary: Concluir upload
      description: >
        Junta as partes, confere o tamanho com o que foi reservado e põe o
        vídeo na fila do `process_video` (ffmpeg: duração, miniatura e
        prévia em 720p). Um arquivo maior do que o informado é descartado.
      operationId: completeVideoUpload
      tags: [media]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteUpload" }
      responses:
        "200":
          description: Vídeo em processamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`video_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "409":
          description: "`upload_closed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`upload_parts_required` ou `upload_incomplete`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`uploads_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/download:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
    get:
      summary: Baixar o arquivo original
      description: >
        URL assinada de 5 minutos que baixa o arquivo enviado (o próprio ou
        um compartilhado com a turma). Vídeos de referência não são baixados.
      operationId: downloadVideo
      tags: [media]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: URL de download
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedURL" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "409":
          description: "`video_not_ready`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`embed_not_downloadable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`uploads_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/videos/{videoId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/VideoId"
      - $ref: "#/components/parameters/ProductId"
    put:
      summary: Ligar vídeo a um produto (só quem enviou)
      description: >
        O vídeo aparece no produto (radar, coleção e listas) para o dono e,
        se compartilhado, para a turma.
      operationId: linkVideoProduct
      tags: [media]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`video_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`video_not_found`, `product_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Tirar vídeo do produto (só quem enviou)
      operationId: unlinkVideoProduct
      tags: [media]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Vídeo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`video_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`video_not_found`, `product_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- notifications -------------------------------------------------------
  /v1/workspaces/{workspaceId}/notifications:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Caixa de notificações do usuário no workspace
      description: As 50 mais recentes e o total de não lidas.
      operationId: getInbox
      tags: [notifications]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Caixa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
  /v1/workspaces/{workspaceId}/notifications/read:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Marcar todas como lidas
      operationId: markAllNotificationsRead
      tags: [notifications]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Marcadas }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
  /v1/workspaces/{workspaceId}/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Marcar como lida
      operationId: markNotificationRead
      tags: [notifications]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Marcada }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404":
          description: "`notification_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/me/notifications:
    get:
      summary: Preferências de notificação
      operationId: getNotificationPreferences
      tags: [notifications]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Preferências
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      summary: Ligar ou desligar os e-mails
      operationId: setNotificationPreferences
      tags: [notifications]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetNotificationPreferences" }
      responses:
        "200":
          description: Preferências
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: "`invalid_notification_preferences` (sem `email`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/me/push:
    post:
      summary: Inscrever este navegador no Web Push
      description: >
        Recebe o `PushSubscription.toJSON()` do navegador. Só aceita
        endpoints dos serviços de push dos navegadores (Google, Mozilla,
        Microsoft e Apple).
      operationId: subscribePush
      tags: [notifications]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "204": { description: Inscrito }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`too_many_push_subscriptions`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_push_subscription`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`push_unavailable` (servidor sem chaves VAPID)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Cancelar o Web Push deste navegador
      operationId: unsubscribePush
      tags: [notifications]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushUnsubscribe" }
      responses:
        "204": { description: Cancelado }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # --- results -------------------------------------------------------------
  /v1/me/results/sync:
    get:
      summary: Situação da sincronização de conversões do usuário
      operationId: getResultsSync
      tags: [results]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Situação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversionSync" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Sincronizar as conversões agora
      description: >
        Enfileira a leitura do conversionReport da Shopee (últimos 89 dias) com
        a credencial do usuário. A sincronização também roda uma vez por dia.
        Se uma já está em andamento, devolve a situação dela.
      operationId: requestResultsSync
      tags: [results]
      security: [{ bearer: [] }]
      responses:
        "202":
          description: Sincronização pedida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversionSync" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`sync_no_credential`: a Shopee não está conectada"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`synced_recently`: a última terminou há menos de 10 minutos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/results:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
    get:
      summary: Os resultados do próprio usuário no workspace
      description: >
        Pedidos e comissão das vendas pelos links do usuário marcados com este
        workspace (no workspace pessoal, também as vendas por links de fora
        do app). A Open API da Shopee não informa cliques.
      operationId: getMyResults
      tags: [results]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyResults" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "422": { $ref: "#/components/responses/InvalidPeriod" }
  /v1/workspaces/{workspaceId}/results/group:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
    get:
      summary: Resultados agregados da turma (dono e mentor)
      description: >
        Somas dos membros que consentiram, no total, por dia, por lista da
        curadoria e por produto. Nunca há números por afiliado. Por lista,
        contam as vendas dos produtos importados da lista, por quem os
        importou, depois da importação.
      operationId: getGroupResults
      tags: [results]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Resultados da turma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResults" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/WorkspaceSuspended" }
        "403":
          description: "`group_results_forbidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: "`group_results_mentorship_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidPeriod" }
  /v1/workspaces/{workspaceId}/results/consent:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      summary: Autorizar ou não o mentor a ver os meus resultados agregados
      description: Continua valendo com o workspace suspenso.
      operationId: setResultsConsent
      tags: [results]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Consent" }
      responses:
        "200":
          description: Consentimento gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        "400":
          description: "`invalid_json` (também sem `shares_results`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "`member_not_found` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`consent_mentorship_only`: o consentimento vale só em mentorias"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- billing -------------------------------------------------------------
  /v1/webhooks/billing:
    post:
      summary: Aviso de cobrança do gateway (webhook)
      description: >
        Recebe os avisos do gateway de cobrança (Asaas em produção). Não usa o
        token do app: a autenticidade vem do segredo do provedor, no cabeçalho
        que ele manda (`asaas-access-token` no Asaas). Um pagamento confirmado
        estende o acesso do workspace; um estorno o suspende na hora.
        Reenvios do mesmo aviso, eventos ignorados e avisos de assinaturas
        desconhecidas respondem 204, para o gateway não reenviar. Corpo de
        até 1 MB.
      operationId: billingWebhook
      tags: [billing]
      security: []
      parameters:
        - name: asaas-access-token
          in: header
          required: false
          description: Segredo do webhook configurado no painel do Asaas (gateway em produção).
          schema: { type: string }
      requestBody:
        required: true
        description: Corpo no formato do provedor.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204": { description: Aviso processado (ou sem efeito) }
        "401":
          description: "`invalid_billing_webhook`: o aviso não veio do gateway, ou o corpo não foi reconhecido"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502":
          description: "`billing_unavailable`: o servidor está sem gateway de cobrança"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/subscription:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: A assinatura do workspace (dono e mentor)
      description: >
        Plano, preço, assentos e situação do acesso. Continua acessível com o
        workspace suspenso: é por aqui que ele volta.
      operationId: getSubscription
      tags: [billing]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Assinatura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`billing_managers_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      summary: Contratar o plano (só o dono)
      description: >
        Abre a assinatura mensal no gateway e devolve a fatura em aberto, que
        quem paga quita por PIX, boleto ou cartão. O acesso só é liberado
        quando o pagamento é confirmado.
      operationId: subscribe
      tags: [billing]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSubscription" }
      responses:
        "201":
          description: Assinatura criada, aguardando pagamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`billing_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: "`already_subscribed`, `seats_in_use` ou `no_price`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_tax_id`, `minimum_seats` ou `seats_above_plan`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`billing_unavailable`: o gateway não respondeu"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      summary: Mudar os assentos da mentoria (só o dono)
      description: >
        Diminuir vale na hora, e nunca abaixo dos assentos em uso (afiliados
        mais convites pendentes). Aumentar vale quando o próximo pagamento for
        confirmado; a cobrança em aberto já sai com o novo valor.
      operationId: changeSeats
      tags: [billing]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSeats" }
      responses:
        "200":
          description: Assinatura atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`billing_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`no_subscription` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`seats_in_use` ou `no_price`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`minimum_seats` ou `seats_above_plan`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`billing_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Cancelar a assinatura (só o dono)
      description: >
        Encerra a cobrança no gateway. O acesso continua até o fim do período
        já pago.
      operationId: cancelSubscription
      tags: [billing]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Assinatura cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`billing_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`no_subscription` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`billing_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/workspaces/{workspaceId}/subscription/simulate-payment:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Simular o pagamento (só no ambiente local)
      description: >
        Confirma a cobrança em aberto sem gateway de verdade. Existe apenas
        quando a cobrança está em modo mock (`simulated` na assinatura); fora
        dele devolve 404 `simulation_unavailable`.
      operationId: simulatePayment
      tags: [billing]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Pagamento aplicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`billing_owner_only`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`simulation_unavailable`, `no_subscription` ou `workspace_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >
        Token de acesso do provedor de identidade: JWT do Zitadel (OIDC),
        token opaco do provedor interno (`/v1/auth/login`) ou `dev:<sub>` no
        modo de desenvolvimento.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      description: Primeiro dia (AAAA-MM-DD, fuso de Brasília). Padrão, 29 dias antes de `to`.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Último dia, inclusive (AAAA-MM-DD). Padrão, hoje. O período tem até 366 dias.
      schema: { type: string, format: date }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
  responses:
    Unauthenticated:
      description: Sem token ou token inválido (`unauthenticated`)
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidJSON:
      description: Corpo que não é JSON, com campo desconhecido ou grande demais (`invalid_json`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: Parâmetro de consulta malformado (`invalid_request`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WorkspaceNotFound:
      description: "`workspace_not_found`: o workspace não existe ou o usuário não é membro dele"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WorkspaceSuspended:
      description: >
        Workspace suspenso por falta de pagamento: `workspace_suspended_owner`
        para o dono, `workspace_suspended` para os demais
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ItemNotFound:
      description: "`item_not_found` ou `workspace_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VideoNotFound:
      description: "`video_not_found` ou `workspace_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ListNotFound:
      description: "`list_not_found` (também um rascunho visto por afiliado) ou `workspace_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ListItemNotFound:
      description: "`list_item_not_found`, `list_not_found` ou `workspace_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ListManagersOnly:
      description: "`list_managers_only`: só dono e mentores montam listas"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ListsMentorshipOnly:
      description: "`lists_mentorship_only`: listas só existem em workspaces de mentoria"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidPeriod:
      description: "`invalid_period`: datas malformadas, `from` depois de `to` ou mais de 366 dias"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "`internal_error`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Código estável para o front. Genéricos: unauthenticated,
            internal_error, invalid_json, invalid_request. Auth (provedor
            interno): invalid_credentials, email_taken, invalid_email,
            invalid_name, weak_password, invalid_auth_token,
            too_many_attempts. Contas: workspace_not_found, member_not_found,
            invite_not_found, forbidden, mentorship_only,
            consent_mentorship_only, owner_cannot_leave, no_seats,
            seats_in_use, seats_above_plan, workspace_suspended,
            workspace_suspended_owner, already_member, invite_expired,
            invite_used, invite_revoked, invite_other_email,
            invalid_workspace_name, invalid_photo_url, invalid_invite_email,
            invalid_invite_validity. Assinatura: billing_owner_only,
            billing_managers_only, already_subscribed, no_subscription,
            invalid_tax_id, minimum_seats, no_price, simulation_unavailable,
            billing_unavailable, invalid_billing_webhook. Shopee:
            invalid_shopee_credential, shopee_access_denied,
            shopee_rate_limited, shopee_unavailable, invalid_app_id,
            invalid_secret. Catálogo e radar: product_not_found,
            invalid_page, invalid_per_page, negative_price,
            invalid_min_commission, invalid_min_rating, invalid_sort,
            query_too_long, invalid_history_days, invalid_product_link,
            short_link. Coleções: item_not_found, collection_not_found,
            collection_exists, no_credential, import_unavailable,
            link_rate_limited, product_lookup_failed,
            product_or_link_required, invalid_item_title,
            invalid_item_description, invalid_item_notes, invalid_tag,
            too_many_tags, invalid_item_status, invalid_affiliate_link,
            invalid_collection_name, too_many_item_collections,
            invalid_item_page. Notificações: notification_not_found,
            push_unavailable, invalid_push_subscription,
            too_many_push_subscriptions, invalid_notification_preferences.
            Mídia: video_not_found, invalid_video_link, video_unavailable,
            platform_unavailable, usage_rights_required,
            invalid_video_format, invalid_video_size, video_too_large,
            video_quota_exceeded, uploads_unavailable, upload_closed,
            upload_incomplete, upload_parts_required, invalid_part_number,
            video_not_ready, video_owner_only, video_share_managers_only,
            video_title_too_long, embed_not_downloadable. Curadoria:
            list_not_found, list_item_not_found, video_not_in_list,
            list_managers_only, lists_mentorship_only, list_limit,
            list_empty, already_in_list, list_full, list_not_published,
            invalid_list_title, invalid_list_description,
            invalid_list_comment, list_comment_required,
            invalid_list_order, product_not_in_list. Resultados:
            group_results_forbidden, group_results_mentorship_only,
            sync_no_credential, synced_recently, invalid_period,
            sync_credential_refused, sync_shopee_unavailable.
        message: { type: string, description: Texto em português pronto para mostrar ao usuário }
    Readiness:
      type: object
      description: "Situação de cada dependência, pelo nome (ex.: postgres, redis)"
      additionalProperties:
        type: string
        enum: [ok, failed]

    # auth
    AuthRegister:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    AuthLogin:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthToken:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string }
    AuthForgotPassword:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
    AuthResetPassword:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
    AuthSession:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Token opaco da sessão, enviado como Bearer.
        expires_at:
          type: string
          format: date-time
          description: A validade é renovada a cada uso.

    # accounts
    User:
      type: object
      required: [id, name, email, email_verified, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        email_verified:
          type: boolean
          description: Convites por e-mail e avisos por e-mail exigem o e-mail confirmado.
        created_at: { type: string, format: date-time }
    Role:
      type: string
      enum: [owner, mentor, affiliate]
    WorkspaceKind:
      type: string
      enum: [personal, mentorship]
    Plan:
      type: string
      enum: [solo, mentorship]
    AccessStatus:
      type: string
      enum: [trial, active, free, suspended]
      description: >
        `trial` no período de avaliação, `active` com a assinatura paga,
        `free` no workspace pessoal de quem é afiliado de uma mentoria em dia
        (não é cobrado, por enquanto) e `suspended` quando o acesso venceu.
        Suspenso, o workspace só permite ver a si mesmo, sair dele (ou
        remover afiliados) e cuidar da assinatura; o resto devolve 402.
    Workspace:
      type: object
      required: [id, kind, name, photo_url, plan, status, access_until, seats, role, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/WorkspaceKind" }
        name: { type: string }
        photo_url: { type: [string, "null"] }
        plan: { $ref: "#/components/schemas/Plan" }
        status: { $ref: "#/components/schemas/AccessStatus" }
        access_until:
          type: string
          format: date-time
          description: Até quando o workspace pode ser usado (fim do teste ou do ciclo pago, mais a tolerância).
        seats:
          type: [integer, "null"]
          description: Assentos contratados na mentoria; nulo enquanto não há pagamento.
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    CreateMentorship:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        photo_url: { type: [string, "null"], format: uri, description: "URL https" }
    UpdateWorkspace:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        photo_url:
          type: string
          description: URL https. String vazia remove a foto.
    Member:
      type: object
      required: [user_id, name, email, role, joined_at, shares_results]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
        shares_results:
          type: boolean
          description: Se o membro autoriza ver os seus resultados agregados no painel da turma.
    CreateInvite:
      type: object
      additionalProperties: false
      properties:
        email: { type: [string, "null"], format: email }
        validity_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
          description: Validade do convite em horas; 0 ou ausente usa o padrão (7 dias).
    Invite:
      type: object
      required: [id, email, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreatedInvite:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          required: [token, url]
          properties:
            token: { type: string, description: Só aparece na criação }
            url: { type: string, format: uri, description: "Link para enviar ao afiliado ({APP_URL}/convite/{token})" }
            email_sent:
              type: boolean
              description: Só em convites com e-mail. Falso quando o e-mail não saiu (o link continua valendo).
    InviteStatus:
      type: string
      enum: [valid, expired, used, revoked]
    PublicInvite:
      type: object
      required: [workspace_name, workspace_photo_url, status, expires_at]
      properties:
        workspace_name: { type: string }
        workspace_photo_url: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/InviteStatus" }
        expires_at: { type: string, format: date-time }

    # shopee
    ConnectShopee:
      type: object
      required: [app_id, secret]
      additionalProperties: false
      properties:
        app_id: { type: string, pattern: "^[0-9]{1,20}$" }
        secret: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
    ShopeeConnection:
      type: object
      required: [status, app_id, verified_at]
      properties:
        status:
          type: string
          enum: [disconnected, connected, invalid, expired]
          description: >
            `invalid`: a Shopee recusou a assinatura (Secret trocado).
            `expired`: a Shopee negou acesso à conta (bloqueada, sem permissão).
        app_id: { type: [string, "null"], description: "AppID mascarado, ex.: ••••5678" }
        verified_at: { type: [string, "null"], format: date-time }

    # radar
    RadarSort:
      type: string
      enum: [trend, commission, earnings, sales]
      default: trend
    RadarCategory:
      type: object
      required: [id, name, products]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        products: { type: integer, format: int64, description: Produtos do radar na categoria }
    Trend:
      type: object
      required: [product_id, name, image_url, shop_name, url, categories, min_price_cents, max_price_cents, commission_bp, earnings_per_sale_cents, sales, rating, score, sales_growth_7d, updated_at]
      properties:
        product_id: { type: string, format: uuid }
        name: { type: string }
        image_url: { type: [string, "null"] }
        shop_name: { type: string }
        url: { type: string, description: Página do produto na Shopee (sem link de afiliado) }
        categories: { type: array, items: { type: integer, format: int64 } }
        min_price_cents: { type: integer, format: int64 }
        max_price_cents: { type: integer, format: int64 }
        commission_bp: { type: integer, description: "Comissão em basis points (1% = 100)" }
        earnings_per_sale_cents: { type: integer, format: int64, description: preço mínimo × comissão }
        sales: { type: integer, format: int64, description: Vendas acumuladas informadas pela Shopee }
        rating: { type: [number, "null"] }
        score: { type: number, description: "Score de tendência de 0 a 100, relativo ao catálogo (0 para um produto que saiu do radar)" }
        sales_growth_7d:
          type: [integer, "null"]
          format: int64
          description: Crescimento de vendas estimado para 7 dias. Nulo quando ainda não há um dia de histórico.
        updated_at: { type: string, format: date-time, description: Coleta mais recente do produto }
    RadarPage:
      type: object
      required: [items, total, page, per_page, updated_at]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Trend" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        per_page: { type: integer }
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Coleta mais recente do catálogo, para o "atualizado há X"
    Snapshot:
      type: object
      required: [collected_at, min_price_cents, max_price_cents, commission_bp, sales, rating]
      properties:
        collected_at: { type: string, format: date-time }
        min_price_cents: { type: integer, format: int64 }
        max_price_cents: { type: integer, format: int64 }
        commission_bp: { type: integer }
        sales: { type: integer, format: int64 }
        rating: { type: [number, "null"] }
    ProductDetail:
      type: object
      required: [product, history]
      properties:
        product: { $ref: "#/components/schemas/Trend" }
        history: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }

    # collections
    ItemStatus:
      type: string
      enum: [testing, winner, discarded]
    Channel:
      type: string
      enum: [instagram, tiktok, whatsapp, other]
    LinkOrigin:
      type: string
      enum: [auto, manual]
    LinkStatus:
      type: string
      enum: [pending, generating, ready, failed]
      description: >
        `pending`: sem credencial da Shopee conectada. `generating`: o job
        `generate_affiliate_link` vai rodar. `failed`: a Shopee não gerou o
        link depois das tentativas.
    ItemProduct:
      type: object
      description: Resumo do produto de um item salvo
      required: [id, name, image_url, shop_name, url, min_price_cents, max_price_cents, commission_bp, earnings_per_sale_cents, sales, rating, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        image_url: { type: [string, "null"] }
        shop_name: { type: string }
        url: { type: string, description: Página do produto na Shopee (sem link de afiliado) }
        min_price_cents: { type: integer, format: int64 }
        max_price_cents: { type: integer, format: int64 }
        commission_bp: { type: integer }
        earnings_per_sale_cents: { type: integer, format: int64 }
        sales: { type: integer, format: int64 }
        rating: { type: [number, "null"] }
        updated_at: { type: string, format: date-time }
    ChannelLink:
      type: object
      required: [channel, sub_id, url]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        sub_id: { type: string, description: "subIds enviados à Shopee, separados por vírgula" }
        url: { type: string }
    Item:
      type: object
      required: [id, product, title, description, notes, tags, status, affiliate_link, link_origin, link_status, links, collection_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product: { $ref: "#/components/schemas/ItemProduct" }
        title: { type: string, description: Título próprio; vazio usa o nome do produto }
        description: { type: string }
        notes: { type: string, description: Notas pessoais; só o próprio usuário vê }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ItemStatus" }
        affiliate_link:
          type: [string, "null"]
          description: Link principal (o manual, ou o automático do canal `other`)
        link_origin: { $ref: "#/components/schemas/LinkOrigin" }
        link_status: { $ref: "#/components/schemas/LinkStatus" }
        links:
          type: array
          description: Links automáticos por canal (subId)
          items: { $ref: "#/components/schemas/ChannelLink" }
        collection_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemPage:
      type: object
      required: [items, total, page, per_page]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        per_page: { type: integer }
    SaveItem:
      type: object
      additionalProperties: false
      properties:
        product_id: { type: [string, "null"], format: uuid, description: Produto do radar }
        url: { type: string, maxLength: 2000, description: "Link do produto na Shopee, ex.: https://shopee.com.br/Nome-i.123.456" }
    UpdateItem:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 5000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 30 }
        status: { $ref: "#/components/schemas/ItemStatus" }
        affiliate_link:
          type: [string, "null"]
          maxLength: 500
          description: URL https. Ausente não muda; `null` volta ao link automático.
    SetItemCollections:
      type: object
      required: [collection_ids]
      additionalProperties: false
      properties:
        collection_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
    PendingLinks:
      type: object
      required: [enqueued]
      properties:
        enqueued: { type: integer, description: Itens enfileirados }
    Collection:
      type: object
      required: [id, name, items, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        items: { type: integer, format: int64, description: Quantidade de itens }
        created_at: { type: string, format: date-time }
    CollectionName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    # curation
    CuratedList:
      type: object
      required: [id, title, description, published_at, created_at, updated_at, products, imported_by_me]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        published_at: { type: [string, "null"], format: date-time, description: Nula enquanto é rascunho }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        products: { type: integer, format: int64 }
        importers: { type: integer, format: int64, description: "Membros que importaram algum produto (só para dono e mentor)" }
        imported_by_me: { type: boolean, description: Se quem vê já importou algum produto da lista }
    MyItem:
      type: object
      description: "O produto na coleção de quem vê a lista, com o link de afiliado dele"
      required: [id, title, description, affiliate_link, link_origin, link_status, links]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        affiliate_link: { type: [string, "null"] }
        link_origin: { $ref: "#/components/schemas/LinkOrigin" }
        link_status: { $ref: "#/components/schemas/LinkStatus" }
        links: { type: array, items: { $ref: "#/components/schemas/ChannelLink" } }
    CuratedListItem:
      type: object
      required: [product, comment, position, my_item, videos]
      properties:
        product: { $ref: "#/components/schemas/ItemProduct" }
        comment: { type: string, description: Dica do mentor sobre o produto }
        position: { type: integer }
        importers: { type: integer, format: int64, description: "Membros que importaram este produto (só para dono e mentor)" }
        my_item:
          oneOf:
            - $ref: "#/components/schemas/MyItem"
            - type: "null"
        videos:
          type: array
          description: "Vídeos do produto que quem vê enxerga (os dele e os compartilhados)"
          items: { $ref: "#/components/schemas/Video" }
    CuratedListDetail:
      allOf:
        - $ref: "#/components/schemas/CuratedList"
        - type: object
          required: [items, videos]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/CuratedListItem" } }
            videos:
              type: array
              description: Vídeos anexados à lista pelo mentor
              items: { $ref: "#/components/schemas/Video" }
    CreateCuratedList:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    UpdateCuratedList:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    AddCuratedListItem:
      type: object
      additionalProperties: false
      properties:
        product_id: { type: [string, "null"], format: uuid, description: Produto do radar }
        url: { type: string, maxLength: 2000, description: Link do produto na Shopee }
        comment: { type: string, maxLength: 1000, description: Dica do mentor sobre o produto }
    CommentCuratedListItem:
      type: object
      required: [comment]
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 1000 }
    ReorderCuratedList:
      type: object
      required: [product_ids]
      additionalProperties: false
      properties:
        product_ids: { type: array, items: { type: string, format: uuid } }
    ImportCuratedList:
      type: object
      additionalProperties: false
      properties:
        product_ids:
          type: array
          description: Produtos a importar; vazio ou ausente importa todos.
          items: { type: string, format: uuid }
        collection:
          type: boolean
          default: true
          description: Também põe os itens numa coleção com o nome da lista.
    ListImport:
      type: object
      required: [created, already_saved, collection_id, link_status]
      properties:
        created: { type: integer }
        already_saved: { type: integer }
        collection_id: { type: [string, "null"], format: uuid }
        link_status:
          $ref: "#/components/schemas/LinkStatus"
          description: Situação dos links dos itens novos
    ListDashboard:
      type: object
      required: [affiliates, importers]
      properties:
        affiliates: { type: integer, description: Afiliados no workspace }
        importers:
          type: array
          items:
            type: object
            required: [user_id, name, products, last_imported_at]
            properties:
              user_id: { type: string, format: uuid }
              name: { type: string }
              products: { type: integer, format: int64 }
              last_imported_at: { type: string, format: date-time }

    # media
    VideoKind:
      type: string
      enum: [embed, upload]
      description: "`embed`: referência de outro criador (só metadados). `upload`: vídeo próprio."
    VideoPlatform:
      type: string
      enum: [youtube, tiktok, upload]
    VideoStatus:
      type: string
      enum: [uploading, processing, ready, failed, unavailable]
      description: >
        `uploading`: upload em andamento. `processing`: na fila do ffmpeg.
        `failed`: o arquivo não pôde ser lido como vídeo. `unavailable`: o
        vídeo de referência sumiu da plataforma.
    Video:
      type: object
      required: [id, kind, platform, status, title, author, url, embed_id, player_url, thumbnail_url, preview_url, duration_s, width, height, size_bytes, file_name, content_type, shared, mine, product_ids, list_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/VideoKind" }
        platform: { $ref: "#/components/schemas/VideoPlatform" }
        status: { $ref: "#/components/schemas/VideoStatus" }
        title: { type: string }
        author: { type: string, description: Autor no YouTube ou no TikTok (embed) }
        url: { type: [string, "null"], description: Página do vídeo na plataforma (embed) }
        embed_id: { type: [string, "null"], description: Id do vídeo na plataforma (embed) }
        player_url: { type: [string, "null"], description: "Player oficial da plataforma, para iframe (embed)" }
        thumbnail_url:
          type: [string, "null"]
          description: Miniatura da plataforma (embed) ou gerada pelo worker (upload pronto, URL assinada)
        preview_url: { type: [string, "null"], description: Prévia em 720p do upload pronto (URL assinada de 6 horas) }
        duration_s: { type: [integer, "null"] }
        width: { type: [integer, "null"], description: "Da prévia, na orientação de exibição" }
        height: { type: [integer, "null"] }
        size_bytes: { type: integer, format: int64 }
        file_name: { type: [string, "null"] }
        content_type: { type: [string, "null"], description: Tipo do arquivo enviado (upload) }
        shared: { type: boolean, description: Visível para todo o workspace }
        mine: { type: boolean, description: Se quem vê é quem enviou }
        product_ids:
          type: array
          description: Produtos ligados (só nos vídeos do próprio usuário)
          items: { type: string, format: uuid }
        list_ids:
          type: array
          description: Listas da curadoria em que está anexado (só nos vídeos do próprio usuário)
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PasteVideo:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2000 }
        product_id: { type: [string, "null"], format: uuid, description: Liga o vídeo a este produto }
    StartUpload:
      type: object
      required: [file_name, content_type, size_bytes, usage_rights]
      additionalProperties: false
      properties:
        file_name: { type: string, description: Nome do arquivo }
        content_type: { type: string, enum: [video/mp4, video/quicktime, video/webm] }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 1073741824 }
        usage_rights: { type: boolean, description: "Declaração \"tenho direito de uso\" (precisa ser true)" }
        product_id: { type: [string, "null"], format: uuid, description: Liga o vídeo a este produto }
    StartedUpload:
      type: object
      required: [video, upload_id, key]
      properties:
        video: { $ref: "#/components/schemas/Video" }
        upload_id: { type: string, description: Id do upload multipart no bucket }
        key: { type: string, description: Chave do objeto no bucket }
    UpdateVideo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        shared: { type: boolean }
    UploadPart:
      type: object
      required: [number, etag]
      properties:
        number: { type: integer, minimum: 1, maximum: 10000 }
        etag: { type: string, description: ETag que o bucket devolveu no PUT da parte }
        size: { type: integer, format: int64, description: Só nas respostas; ignorado ao concluir }
    SignPart:
      type: object
      required: [number]
      additionalProperties: false
      properties:
        number: { type: integer, minimum: 1, maximum: 10000 }
    CompleteUpload:
      type: object
      required: [parts]
      additionalProperties: false
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/UploadPart" }
    SignedURL:
      type: object
      required: [url]
      properties:
        url: { type: string }
    VideoQuota:
      type: object
      required: [used_bytes, limit_bytes]
      properties:
        used_bytes: { type: integer, format: int64 }
        limit_bytes: { type: integer, format: int64 }

    # notifications
    Notification:
      type: object
      required: [id, kind, title, body, url, created_at, read_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "ex.: list_published, billing" }
        title: { type: string }
        body: { type: string }
        url: { type: string, description: "Caminho no app, ex.: /w/{workspaceId}/listas/{listId}" }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    Inbox:
      type: object
      required: [notifications, unread]
      properties:
        notifications: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        unread: { type: integer, format: int64 }
    NotificationPreferences:
      type: object
      required: [email, push_public_key, push_subscriptions]
      properties:
        email: { type: boolean, description: Receber as notificações por e-mail }
        push_public_key:
          type: [string, "null"]
          description: Chave VAPID para o navegador se inscrever; nula sem Web Push no servidor
        push_subscriptions: { type: integer, format: int64, description: Navegadores inscritos no Web Push }
    SetNotificationPreferences:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: boolean }
    PushSubscription:
      type: object
      required: [endpoint, keys]
      additionalProperties: false
      properties:
        endpoint: { type: string, maxLength: 1000 }
        keys:
          type: object
          required: [p256dh, auth]
          additionalProperties: false
          properties:
            p256dh: { type: string, maxLength: 200 }
            auth: { type: string, maxLength: 100 }
    PushUnsubscribe:
      type: object
      required: [endpoint]
      additionalProperties: false
      properties:
        endpoint: { type: string }

    # results
    Consent:
      type: object
      required: [shares_results]
      additionalProperties: false
      properties:
        shares_results: { type: boolean }
    ConversionSync:
      type: object
      required: [status, requested_at, finished_at, conversions, error_code, error]
      properties:
        status: { type: string, enum: [never, syncing, ok, error, no_credential] }
        requested_at: { type: [string, "null"], format: date-time }
        finished_at:
          type: [string, "null"]
          format: date-time
          description: Fim da última sincronização que deu certo.
        conversions: { type: integer, description: Itens de pedido lidos na última sincronização que deu certo. }
        error_code:
          type: [string, "null"]
          description: "Código do erro da última, quando falhou (ex.: sync_credential_refused, sync_shopee_unavailable)."
        error: { type: [string, "null"], description: Texto em português de `error_code`. }
    Period:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    ResultTotals:
      type: object
      description: >
        Dinheiro em centavos. Pedidos e itens não contam os cancelados.
        Comissão estimada soma os pedidos não cancelados; validada, os
        concluídos.
      required: [orders, cancelled, items, sales_cents, estimated_commission_cents, validated_commission_cents]
      properties:
        orders: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
        items: { type: integer, format: int64 }
        sales_cents: { type: integer, format: int64 }
        estimated_commission_cents: { type: integer, format: int64 }
        validated_commission_cents: { type: integer, format: int64 }
    DayResult:
      type: object
      required: [day, orders, estimated_commission_cents, validated_commission_cents]
      properties:
        day: { type: string, format: date }
        orders: { type: integer, format: int64 }
        estimated_commission_cents: { type: integer, format: int64 }
        validated_commission_cents: { type: integer, format: int64 }
    ProductResult:
      type: object
      required: [item_id, product_id, name, shop_name, image_url, orders, items, sales_cents, estimated_commission_cents, validated_commission_cents]
      properties:
        item_id: { type: integer, format: int64, description: Id do item na Shopee }
        product_id:
          type: [string, "null"]
          format: uuid
          description: "Produto do catálogo, quando o item está nele."
        name: { type: string }
        shop_name: { type: string }
        image_url: { type: [string, "null"] }
        orders: { type: integer, format: int64 }
        items: { type: integer, format: int64 }
        sales_cents: { type: integer, format: int64 }
        estimated_commission_cents: { type: integer, format: int64 }
        validated_commission_cents: { type: integer, format: int64 }
    ChannelResult:
      type: object
      required: [channel, orders, estimated_commission_cents, validated_commission_cents]
      properties:
        channel:
          type: string
          enum: [instagram, tiktok, whatsapp, other, ""]
          description: Vazio quando a venda veio de um link criado fora do app.
        orders: { type: integer, format: int64 }
        estimated_commission_cents: { type: integer, format: int64 }
        validated_commission_cents: { type: integer, format: int64 }
    ListResult:
      type: object
      required: [id, title, published_at, importers, orders, sales_cents, estimated_commission_cents, validated_commission_cents]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        published_at: { type: string, format: date-time }
        importers: { type: integer, description: "Quem da turma importou a lista (consentindo ou não)." }
        orders: { type: integer, format: int64 }
        sales_cents: { type: integer, format: int64 }
        estimated_commission_cents: { type: integer, format: int64 }
        validated_commission_cents: { type: integer, format: int64 }
    MyResults:
      type: object
      required: [period, sync, shares_results, totals, by_day, by_product, by_channel]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        sync: { $ref: "#/components/schemas/ConversionSync" }
        shares_results:
          type: [boolean, "null"]
          description: Só em mentorias. Se o usuário mostra os resultados ao mentor.
        totals: { $ref: "#/components/schemas/ResultTotals" }
        by_day: { type: array, items: { $ref: "#/components/schemas/DayResult" } }
        by_product: { type: array, items: { $ref: "#/components/schemas/ProductResult" } }
        by_channel: { type: array, items: { $ref: "#/components/schemas/ChannelResult" } }
    GroupResults:
      type: object
      required: [period, affiliates, sharing, active, totals, by_day, by_list, by_product]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        affiliates: { type: integer, description: Afiliados do workspace. }
        sharing: { type: integer, description: Membros que autorizam ver os resultados. }
        active: { type: integer, format: int64, description: "Dos que autorizam, quantos venderam no período." }
        totals: { $ref: "#/components/schemas/ResultTotals" }
        by_day: { type: array, items: { $ref: "#/components/schemas/DayResult" } }
        by_list: { type: array, items: { $ref: "#/components/schemas/ListResult" } }
        by_product: { type: array, items: { $ref: "#/components/schemas/ProductResult" } }

    # billing
    SubscriptionStatus:
      type: string
      enum: [none, pending, active, overdue, cancelled]
    Subscription:
      type: object
      required:
        [plan, access_status, access_until, status, provider, price_cents,
         seats, seats_in_use, max_seats, amount_cents, next_due_date,
         payment_url, simulated]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        access_status: { $ref: "#/components/schemas/AccessStatus" }
        access_until:
          type: string
          format: date-time
          description: Até quando o workspace pode ser usado (fim do teste ou do ciclo pago, mais a tolerância).
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        provider: { type: string, description: "Gateway de cobrança (ex.: asaas); vazio sem assinatura." }
        price_cents:
          type: integer
          format: int64
          description: >
            Preço mensal do plano: do workspace no solo, de cada assento na
            mentoria.
        seats: { type: integer, format: int64, description: Assentos contratados (0 sem assinatura). }
        seats_in_use: { type: integer, format: int64, description: Afiliados mais convites pendentes. }
        max_seats: { type: integer, format: int64, description: Teto do plano. }
        amount_cents: { type: integer, format: int64, description: Total mensal da assinatura (0 sem assinatura). }
        next_due_date:
          type: [string, "null"]
          format: date
          description: Vencimento da cobrança em aberto (ou da próxima), AAAA-MM-DD.
        payment_url:
          type: [string, "null"]
          description: Fatura em aberto no gateway (PIX, boleto ou cartão).
        simulated:
          type: boolean
          description: >
            Ambiente local com cobrança em modo mock: a tela pode oferecer
            simular o pagamento.
    NewSubscription:
      type: object
      required: [tax_id]
      additionalProperties: false
      properties:
        seats:
          type: integer
          format: int64
          minimum: 1
          description: Assentos da mentoria. Ignorado no plano solo.
        tax_id: { type: string, description: "CPF ou CNPJ de quem paga, com ou sem pontuação, exigido pelo gateway." }
    ChangeSeats:
      type: object
      required: [seats]
      additionalProperties: false
      properties:
        seats: { type: integer, format: int64, minimum: 1 }
