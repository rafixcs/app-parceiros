openapi: 3.1.0
info:
  title: App Parceiros API
  version: 0.1.0
  description: >
    Contrato da API do App Parceiros. É a fonte da verdade: altere aqui
    antes de implementar e gere os clientes a partir deste arquivo.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Verificação de vida do processo
      operationId: healthz
      security: []
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      summary: Verificação de prontidão (Postgres e Redis)
      operationId: readyz
      security: []
      responses:
        "200":
          description: Todas as dependências respondem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prontidao"
        "503":
          description: Alguma dependência falhou
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prontidao"
  /v1/eu:
    get:
      summary: Usuário autenticado
      description: >
        No primeiro acesso, cria o usuário a partir do perfil do Zitadel e o
        seu workspace pessoal.
      operationId: eu
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /v1/workspaces:
    get:
      summary: Workspaces de que o usuário participa (seletor do topo)
      operationId: listarWorkspaces
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspaces, o pessoal primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      summary: Criar mentoria
      description: Cria um workspace do tipo mentoria com o usuário como dono.
      operationId: criarMentoria
      tags: [contas]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              additionalProperties: false
              properties:
                nome: { type: string, minLength: 1, maxLength: 80 }
                foto_url: { type: [string, "null"], format: uri, description: "URL https" }
      responses:
        "201":
          description: Mentoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Detalhe do workspace
      operationId: verWorkspace
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      summary: Alterar nome e foto (só o dono)
      operationId: atualizarWorkspace
      tags: [contas]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nome: { type: string, minLength: 1, maxLength: 80 }
                foto_url:
                  type: string
                  description: URL https. String vazia remove a foto.
      responses:
        "200":
          description: Workspace atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/membros:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Membros do workspace (dono e mentor)
      operationId: listarMembros
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Membros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/membros/{usuarioId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: usuarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Sair do workspace ou remover um membro
      description: >
        Com o próprio id, o usuário sai do workspace. Dono e mentor removem
        afiliados; só o dono remove mentores; o dono não sai nem é removido.
        Os dados pessoais do afiliado (coleção, credencial) continuam dele.
      operationId: removerMembro
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Removido }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/convites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Convites pendentes (dono e mentor)
      operationId: listarConvites
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Convites ainda válidos, sem o token
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Convite" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
    post:
      summary: Convidar afiliado
      description: >
        Gera um convite de uso único para um workspace de mentoria. Com
        e-mail, só a conta com aquele e-mail verificado pode aceitar. Convites
        pendentes ocupam assento do plano. O token só aparece nesta resposta.
      operationId: criarConvite
      tags: [contas]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: [string, "null"], format: email }
                validade_horas:
                  type: integer
                  minimum: 1
                  maximum: 720
                  default: 168
      responses:
        "201":
          description: Convite criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConviteCriado" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`so_mentoria` ou `sem_assentos`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/convites/{conviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: conviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Cancelar convite pendente
      operationId: revogarConvite
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Cancelado }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/convites/{token}:
    parameters:
      - $ref: "#/components/parameters/TokenConvite"
    get:
      summary: Ver convite (público)
      description: Mostra o workspace e a situação do convite antes do login.
      operationId: verConvite
      security: []
      tags: [contas]
      responses:
        "200":
          description: Convite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvitePublico" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/convites/{token}/aceitar:
    parameters:
      - $ref: "#/components/parameters/TokenConvite"
    post:
      summary: Aceitar convite
      description: Torna o usuário afiliado do workspace do convite.
      operationId: aceitarConvite
      tags: [contas]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Workspace em que o usuário entrou
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403":
          description: "`convite_outro_email`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`ja_membro` ou `sem_assentos`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "410":
          description: "`convite_expirado`, `convite_usado` ou `convite_revogado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /v1/eu/shopee:
    get:
      summary: Situação da conexão com a Shopee
      description: >
        A credencial (AppID e Secret da Open API de afiliados) pertence ao
        usuário, não ao workspace. O Secret nunca aparece em resposta.
      operationId: verConexaoShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Situação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConexaoShopee" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    put:
      summary: Conectar a conta de afiliado
      description: >
        Valida o AppID e o Secret com uma chamada de teste à Shopee e guarda a
        credencial cifrada (envelope encryption). Substitui a credencial
        anterior, se houver.
      operationId: conectarShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, secret]
              additionalProperties: false
              properties:
                app_id: { type: string, pattern: "^[0-9]{1,20}$" }
                secret: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
      responses:
        "200":
          description: Conectado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConexaoShopee" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "422":
          description: "`dados_invalidos` ou `credencial_invalida` (a Shopee recusou o AppID ou o Secret)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429":
          description: "`shopee_limite` (a Shopee limitou as chamadas; tente de novo em instantes)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "502":
          description: "`shopee_indisponivel`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      summary: Desconectar (apaga a credencial)
      operationId: desconectarShopee
      tags: [shopee]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Desconectado }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /v1/workspaces/{workspaceId}/radar:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Radar de produtos em alta
      description: >
        Lista ranqueada do catálogo coletado pelo job `snapshot_catalogo`
        (credencial do app) com o score do job `calcular_tendencias`.
        Valores em centavos e comissão em basis points (1% = 100).
      operationId: radar
      tags: [radar]
      security: [{ bearer: [] }]
      parameters:
        - { name: categoria, in: query, schema: { type: integer, format: int64 } }
        - { name: preco_min, in: query, description: Centavos, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: preco_max, in: query, description: Centavos, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: comissao_min, in: query, description: Basis points, schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { name: nota_min, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: q, in: query, description: Busca no nome do produto e da loja, schema: { type: string, maxLength: 100 } }
        - name: ordem
          in: query
          schema: { type: string, enum: [tendencia, comissao, ganho, vendas], default: tendencia }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        "200":
          description: Página do radar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarPagina" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/radar/categorias:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Categorias presentes no radar (para o filtro)
      operationId: radarCategorias
      tags: [radar]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Categorias, as com mais produtos primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Categoria" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
  /v1/workspaces/{workspaceId}/radar/produtos/{produtoId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: produtoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Detalhe do produto com histórico
      operationId: radarProduto
      tags: [radar]
      security: [{ bearer: [] }]
      parameters:
        - { name: dias, in: query, description: Janela do histórico, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200":
          description: Produto e snapshots da janela, do mais antigo ao mais novo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/Erro" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso do Zitadel (OIDC).
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenConvite:
      name: token
      in: path
      required: true
      schema: { type: string }
  responses:
    NaoAutenticado:
      description: Sem token ou token inválido (`nao_autenticado`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Erro:
      description: Erro com código e mensagem para o usuário
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
  schemas:
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          description: >
            Código estável para o front. Em contas: nao_autenticado,
            dados_invalidos, json_invalido, sem_permissao,
            workspace_nao_encontrado, membro_nao_encontrado,
            convite_nao_encontrado, so_mentoria, dono_nao_sai, sem_assentos,
            ja_membro, convite_expirado, convite_usado, convite_revogado,
            convite_outro_email, erro_interno. Em shopee: credencial_invalida,
            shopee_limite, shopee_indisponivel. Em radar: produto_nao_encontrado.
        mensagem: { type: string, description: Texto pronto para mostrar ao usuário }
    Usuario:
      type: object
      required: [id, nome, email, criado_em]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        criado_em: { type: string, format: date-time }
    Papel:
      type: string
      enum: [dono, mentor, afiliado]
    Workspace:
      type: object
      required: [id, tipo, nome, foto_url, plano, status, papel, criado_em]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [pessoal, mentoria] }
        nome: { type: string }
        foto_url: { type: [string, "null"] }
        plano: { type: string, enum: [avulso, mentoria] }
        status: { type: string }
        papel: { $ref: "#/components/schemas/Papel" }
        criado_em: { type: string, format: date-time }
    Membro:
      type: object
      required: [usuario_id, nome, email, papel, entrou_em]
      properties:
        usuario_id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        papel: { $ref: "#/components/schemas/Papel" }
        entrou_em: { type: string, format: date-time }
    Convite:
      type: object
      required: [id, email, expira_em, criado_em]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }
        expira_em: { type: string, format: date-time }
        criado_em: { type: string, format: date-time }
    ConviteCriado:
      allOf:
        - $ref: "#/components/schemas/Convite"
        - type: object
          required: [token, url]
          properties:
            token: { type: string, description: Só aparece na criação }
            url: { type: string, format: uri, description: "Link para enviar ao afiliado ({APP_URL}/convite/{token})" }
    ConvitePublico:
      type: object
      required: [workspace_nome, workspace_foto_url, status, expira_em]
      properties:
        workspace_nome: { type: string }
        workspace_foto_url: { type: [string, "null"] }
        status: { type: string, enum: [valido, expirado, usado, revogado] }
        expira_em: { type: string, format: date-time }
    ConexaoShopee:
      type: object
      required: [status, app_id, verificado_em]
      properties:
        status:
          type: string
          enum: [desconectado, conectado, invalido, expirado]
          description: >
            `invalido`: a Shopee recusou a assinatura (Secret trocado).
            `expirado`: a Shopee negou acesso à conta (bloqueada, sem permissão).
        app_id: { type: [string, "null"], description: "AppID mascarado, ex.: ••••5678" }
        verificado_em: { type: [string, "null"], format: date-time }
    Categoria:
      type: object
      required: [id, nome, produtos]
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        produtos: { type: integer }
    RadarItem:
      type: object
      required: [produto_id, nome, imagem_url, loja_nome, url, categorias, preco_min_centavos, preco_max_centavos, comissao_bp, ganho_por_venda_centavos, vendas, nota, score, vendas_7d, atualizado_em]
      properties:
        produto_id: { type: string, format: uuid }
        nome: { type: string }
        imagem_url: { type: [string, "null"] }
        loja_nome: { type: string }
        url: { type: string, description: Página do produto na Shopee (sem link de afiliado) }
        categorias: { type: array, items: { type: integer, format: int64 } }
        preco_min_centavos: { type: integer, format: int64 }
        preco_max_centavos: { type: integer, format: int64 }
        comissao_bp: { type: integer, description: "Comissão em basis points (1% = 100)" }
        ganho_por_venda_centavos: { type: integer, format: int64, description: preço mínimo × comissão }
        vendas: { type: integer, format: int64, description: Vendas acumuladas informadas pela Shopee }
        nota: { type: [number, "null"] }
        score: { type: number, description: "Score de tendência de 0 a 100, relativo ao catálogo" }
        vendas_7d:
          type: [integer, "null"]
          format: int64
          description: Crescimento de vendas estimado para 7 dias. Nulo quando ainda não há um dia de histórico.
        atualizado_em: { type: string, format: date-time, description: Coleta mais recente do produto }
    RadarPagina:
      type: object
      required: [itens, total, pagina, por_pagina, atualizado_em]
      properties:
        itens: { type: array, items: { $ref: "#/components/schemas/RadarItem" } }
        total: { type: integer }
        pagina: { type: integer }
        por_pagina: { type: integer }
        atualizado_em:
          type: [string, "null"]
          format: date-time
          description: Coleta mais recente do catálogo, para o "atualizado há X"
    Snapshot:
      type: object
      required: [coletado_em, preco_min_centavos, preco_max_centavos, comissao_bp, vendas, nota]
      properties:
        coletado_em: { type: string, format: date-time }
        preco_min_centavos: { type: integer, format: int64 }
        preco_max_centavos: { type: integer, format: int64 }
        comissao_bp: { type: integer }
        vendas: { type: integer, format: int64 }
        nota: { type: [number, "null"] }
    RadarDetalhe:
      type: object
      required: [produto, historico]
      properties:
        produto: { $ref: "#/components/schemas/RadarItem" }
        historico: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
    Prontidao:
      type: object
      additionalProperties:
        type: string
        enum: [ok, falhou]
