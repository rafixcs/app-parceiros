server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Files with a hash in the name never change: long cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The service worker, manifest and index must be revalidated on every visit,
    # otherwise the PWA gets stuck on an old version.
    location ~ ^/(sw\.js|push-sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # TanStack Router routes: anything that is not a file falls back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
