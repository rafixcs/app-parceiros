# A single domain: /v1 (and the /healthz of the uptime check) go to the API,
# everything else to the front end. So the front end calls the API on the same
# address, without CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parceiros
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: CHANGE-ME-ip-name
    networking.gke.io/managed-certificates: parceiros
    networking.gke.io/v1beta1.FrontendConfig: parceiros
spec:
  rules:
    - host: CHANGE-ME.domain
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: parceiros-api
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: parceiros-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parceiros-web
                port:
                  name: http
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: parceiros
spec:
  domains:
    - CHANGE-ME.domain
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: parceiros
spec:
  redirectToHttps:
    enabled: true
