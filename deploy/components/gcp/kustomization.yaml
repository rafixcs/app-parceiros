# Pieces of an environment on GCP (GKE Autopilot), shared by staging and prod:
# the front end (nginx), the Ingress with a managed certificate, the non-secret
# configuration and the pod hardening. The values of each environment (domain,
# IP, configuration) live in the overlay.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - web.yaml
  - ingress.yaml
  - api-hpa.yaml
patches:
  - path: config-and-security.yaml
    target:
      kind: (Deployment|Job)
      labelSelector: app.kubernetes.io/part-of=app-parceiros
  - path: resources.yaml
