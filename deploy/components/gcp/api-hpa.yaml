apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parceiros-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parceiros-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parceiros-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parceiros-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parceiros-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parceiros-web
