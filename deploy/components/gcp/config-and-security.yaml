# Applied to every Deployment and Job of the app: containers without root and
# without extra privileges. (The non-secret configuration, the parceiros-config
# ConfigMap, and the Secret are mounted by resources.yaml.)
- op: add
  path: /spec/template/spec/securityContext
  value:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
- op: add
  path: /spec/template/spec/containers/0/securityContext
  value:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
