# Argo CD applications for production. Install Argo CD in the cluster and apply
# this file once (kubectl apply -n argocd -f deploy/argocd/prod.yaml).
# The environment (configuration and secrets) syncs by itself; the app only
# after the parceiros-env Secret exists, and it runs the migration as PreSync
# (deploy/base/migrate-job.yaml) on every deploy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parceiros-prod-environment
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rafixcs/app-parceiros
    targetRevision: main
    path: deploy/overlays/prod/environment
  destination:
    server: https://kubernetes.default.svc
    namespace: parceiros-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parceiros-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rafixcs/app-parceiros
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: parceiros-prod
  # Manual sync: the production deploy is one click (or `argocd app sync
  # parceiros-prod`) after checking the diff.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
