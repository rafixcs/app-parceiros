apiVersion: batch/v1
kind: Job
metadata:
  name: parceiros-migrate
  annotations:
    # On Argo CD, the migrations run before each sync.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: parceiros
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: parceiros-env
