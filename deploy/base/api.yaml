apiVersion: apps/v1
kind: Deployment
metadata:
  name: parceiros-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parceiros-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parceiros-api
    spec:
      containers:
        - name: api
          image: parceiros
          args: ["api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: parceiros-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parceiros-api
spec:
  selector:
    app.kubernetes.io/name: parceiros-api
  ports:
    - name: http
      port: 80
      targetPort: http
