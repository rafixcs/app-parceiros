# Armazenamento compatível com S3 no lugar do Cloudflare R2 no ambiente local.
# (O MinIO deixou de publicar a imagem no Docker Hub.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3
data:
  # Mesmas chaves de S3_ACCESS_KEY e S3_SECRET_KEY em kustomization.yaml.
  s3.json: |
    {"identities": [{
      "name": "parceiros",
      "credentials": [{"accessKey": "parceiros", "secretKey": "parceiros-dev"}],
      "actions": ["Admin", "Read", "List", "Tagging", "Write"]
    }]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=64
            - -volume.max=8
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
          volumeMounts:
            - name: config
              mountPath: /etc/seaweedfs
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: seaweedfs-s3
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
