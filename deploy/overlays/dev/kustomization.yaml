# Ambiente local (Tilt + kind/k3d). Postgres, Redis e SeaweedFS (S3) rodam no cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parceiros
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - redis.yaml
  - seaweedfs.yaml
secretGenerator:
  - name: parceiros-env
    literals:
      - APP_ENV=dev
      - APP_URL=http://localhost:5173
      # Sem Zitadel no cluster local: a API aceita tokens "dev:<sub>".
      - AUTH_MODE=dev
      - DATABASE_URL=postgres://parceiros:parceiros@postgres:5432/parceiros?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=parceiros
      - S3_ACCESS_KEY=parceiros
      - S3_SECRET_KEY=parceiros-dev
      # Chave mestra só do ambiente local; staging e prod usam o secret manager.
      - CRYPTO_KEK=FqpezR/uQXmGJwq4y1/m3ULeVkNyjxAF5OpNgmPmqVE=
      - CRYPTO_KEK_ID=dev-1
      # Sem credencial aprovada, a Shopee roda com as respostas gravadas.
      - SHOPEE_MODO=mock
