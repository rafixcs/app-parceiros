# Ambiente local (Tilt + kind/k3d). Postgres, Redis e MinIO rodam no cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parceiros
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - redis.yaml
  - minio.yaml
secretGenerator:
  - name: parceiros-env
    literals:
      - APP_ENV=dev
      - DATABASE_URL=postgres://parceiros:parceiros@postgres:5432/parceiros?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=parceiros
      - S3_ACCESS_KEY=parceiros
      - S3_SECRET_KEY=parceiros-dev
