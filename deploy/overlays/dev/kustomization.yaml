# Local environment (Tilt + kind/k3d). Postgres, Redis, SeaweedFS (S3) and Mailpit (SMTP) run in the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parceiros
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - redis.yaml
  - seaweedfs.yaml
  - mailpit.yaml
secretGenerator:
  - name: parceiros-env
    literals:
      - APP_ENV=dev
      - APP_URL=http://localhost:5173
      # No Zitadel in the local cluster: the API accepts "dev:<sub>" tokens.
      - AUTH_PROVIDER=dev
      - DATABASE_URL=postgres://parceiros:parceiros@postgres:5432/parceiros?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      # The browser uploads and downloads the videos through the Tilt port-forward.
      - S3_PUBLIC_ENDPOINT=http://localhost:8333
      - S3_BUCKET=parceiros
      - S3_ACCESS_KEY=parceiros
      - S3_SECRET_KEY=parceiros-dev
      # Master key of the local environment only; staging and prod use the secret manager.
      - CRYPTO_KEK=FqpezR/uQXmGJwq4y1/m3ULeVkNyjxAF5OpNgmPmqVE=
      - CRYPTO_KEK_ID=dev-1
      # Without an approved credential, Shopee runs on the recorded answers.
      - SHOPEE_MODE=mock
      # Emails go to Mailpit (inbox at http://localhost:8025).
      - SMTP_ADDR=mailpit:1025
      # Without an Asaas account, billing runs in mock mode: nothing is charged
      # and the payment is confirmed by the "Simular pagamento" button.
      - BILLING_MODE=mock
      # VAPID keys of the local environment only (Web Push). For staging and prod,
      # generate others with `parceiros vapid` and keep them in the secret manager.
      - VAPID_PUBLIC_KEY=BLXbTU9Hzbxo91E8FSaKzDJtrgJCEYeNfdym2p605AvtmKxHIc4pOEbSoRF3VCj6hqk1fp_UxTtgbLcwXxeBKns
      - VAPID_PRIVATE_KEY=-peDNMTtbA8giu7uReUG-s2VQn7oF7TwC-6emmkn3UQ
