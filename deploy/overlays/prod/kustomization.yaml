# Production on GCP (GKE Autopilot + Cloud SQL + Memorystore), created by the
# Terraform in deploy/terraform/gcp. Before the first deploy, replace the values
# marked with CHANGE-ME here and in environment/ (domain, project, Zitadel, R2,
# SMTP, VAPID). The step by step is in docs/lancamento.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parceiros-prod
resources:
  - ../../base
components:
  - ../../components/gcp
images:
  - name: parceiros
    newName: southamerica-east1-docker.pkg.dev/CHANGE-ME-project/parceiros/parceiros
    newTag: latest # the deploy replaces it with the commit tag (sha)
  - name: parceiros-web
    newName: southamerica-east1-docker.pkg.dev/CHANGE-ME-project/parceiros/parceiros-web
    newTag: latest
patches:
  - target:
      kind: Ingress
      name: parceiros
    patch: |-
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
        value: parceiros-prod-ingress
      - op: replace
        path: /spec/rules/0/host
        value: CHANGE-ME.domain
  - target:
      kind: ManagedCertificate
      name: parceiros
    patch: |-
      - op: replace
        path: /spec/domains/0
        value: CHANGE-ME.domain
