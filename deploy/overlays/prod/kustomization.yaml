# Ambiente prod: Postgres e Redis gerenciados. O secret parceiros-env é criado
# fora do repositório (External Secrets / secret manager da cloud).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parceiros-prod
resources:
  - ../../base
images:
  - name: parceiros
    newName: ghcr.io/rafixcs/app-parceiros
    newTag: latest # o CI substitui pela tag do commit
