# Without an auth block, External Secrets uses the controller's own identity
# (Workload Identity), which Terraform allows to read these secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp
spec:
  provider:
    gcpsm:
      projectID: CHANGE-ME-project
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: parceiros-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp
  target:
    name: parceiros-env
    creationPolicy: Owner
  dataFrom:
    - find:
        tags:
          app: parceiros
          environment: prod
      rewrite:
        - regexp:
            source: "^prod-(.*)$"
            target: "$1"
