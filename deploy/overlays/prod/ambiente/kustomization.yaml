# Ambiente de produção, sincronizado antes do app: o namespace, a configuração
# não secreta (ConfigMap parceiros-config) e os segredos. O External Secrets
# Operator lê do Secret Manager os segredos com os rótulos app=parceiros e
# ambiente=prod (criados pelo Terraform) e monta o Secret parceiros-env, sem o
# prefixo "prod-" nos nomes. Fica separado do app porque a migration (PreSync)
# já precisa dos dois.
#
# O ConfigMap tem nome fixo: depois de mudar um valor, reinicie os pods
# (kubectl -n parceiros-prod rollout restart deploy).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parceiros-prod
resources:
  - namespace.yaml
  - external-secret.yaml
configMapGenerator:
  - name: parceiros-config
    literals:
      - APP_ENV=prod
      - APP_URL=https://TROCAR.dominio
      - AUTH_PROVIDER=oidc
      - OIDC_ISSUER=https://TROCAR-instancia.zitadel.cloud
      - OIDC_AUDIENCE=TROCAR-client-id-do-app-web
      - CRYPTO_KEK_ID=prod-1
      - SHOPEE_MODE=api
      - BILLING_MODE=asaas
      - ASAAS_URL=https://api.asaas.com/v3
      - S3_ENDPOINT=https://TROCAR-conta.r2.cloudflarestorage.com
      - S3_PUBLIC_ENDPOINT=https://TROCAR-conta.r2.cloudflarestorage.com
      - S3_BUCKET=parceiros-prod
      - S3_REGION=auto
      - SMTP_ADDR=TROCAR-smtp:587
      - SMTP_FROM=App Parceiros <nao-responda@TROCAR.dominio>
      - VAPID_PUBLIC_KEY=TROCAR-gerada-por-parceiros-vapid
      - VAPID_SUBJECT=contato@TROCAR.dominio
    options:
      disableNameSuffixHash: true
