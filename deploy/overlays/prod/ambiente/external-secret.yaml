# Sem bloco auth, o External Secrets usa a identidade do próprio controlador
# (Workload Identity), que o Terraform autoriza a ler esses segredos.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp
spec:
  provider:
    gcpsm:
      projectID: TROCAR-projeto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: parceiros-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp
  target:
    name: parceiros-env
    creationPolicy: Owner
  dataFrom:
    - find:
        tags:
          app: parceiros
          ambiente: prod
      rewrite:
        - regexp:
            source: "^prod-(.*)$"
            target: "$1"
