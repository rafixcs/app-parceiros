# Staging environment: managed Postgres and Redis. The parceiros-env secret is
# created outside the repository (External Secrets / the cloud secret manager).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: parceiros-staging
resources:
  - ../../base
images:
  - name: parceiros
    newName: ghcr.io/rafixcs/app-parceiros
    newTag: latest # CI replaces it with the commit tag
