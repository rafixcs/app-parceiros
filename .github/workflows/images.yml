name: Images

# Pushes the API/worker and front-end images to Artifact Registry on every
# push to main, tagged with the commit. It does not deploy: production only
# changes when the tag is replaced in deploy/overlays/prod and Argo CD syncs.
#
# It stays off until the repository variables exist (Settings > Secrets and
# variables > Actions > Variables), with the values of the Terraform outputs:
#   GCP_WIF_PROVIDER   github_wif_provider
#   GCP_REGISTRY       image_registry
#   VITE_OIDC_ISSUER   and VITE_OIDC_CLIENT_ID of the web app in Zitadel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGISTRY%%/*}" --quiet
        env:
          GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.GCP_REGISTRY }}/parceiros:${{ github.sha }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ vars.GCP_REGISTRY }}/parceiros-web:${{ github.sha }}
          build-args: |
            VITE_OIDC_ISSUER=${{ vars.VITE_OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
          cache-from: type=gha,scope=web
