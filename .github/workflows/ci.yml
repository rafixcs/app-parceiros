name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: ffmpeg para os testes de mídia
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go vet ./...
      - name: código do sqlc em dia
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tipos da API em dia com o openapi.yaml
        run: npm run api && git diff --exit-code src/api/schema.d.ts
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parceiros
          POSTGRES_PASSWORD: parceiros
          POSTGRES_DB: parceiros
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parceiros"
          --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
      # Receives the emails of the internal identity provider.
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    env:
      APP_ENV: dev
      AUTH_PROVIDER: dev
      DATABASE_URL: postgres://parceiros:parceiros@localhost:5432/parceiros?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      CRYPTO_KEK: FqpezR/uQXmGJwq4y1/m3ULeVkNyjxAF5OpNgmPmqVE=
      CRYPTO_KEK_ID: ci-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API e worker
        working-directory: backend
        run: |
          go build -o /tmp/parceiros ./cmd/parceiros
          /tmp/parceiros migrate
          /tmp/parceiros api > /tmp/api.log 2>&1 &
          /tmp/parceiros worker > /tmp/worker.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8080/readyz && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - name: API com o provedor de identidade interno (e-mail e senha)
        working-directory: backend
        run: |
          pkill -f '^/tmp/parceiros api' || true
          sleep 1
          AUTH_PROVIDER=internal SMTP_ADDR=localhost:1025 /tmp/parceiros api > /tmp/api-internal.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8080/readyz && exit 0; sleep 1; done
          cat /tmp/api-internal.log; exit 1
      - run: npm run e2e
        working-directory: web
        env:
          E2E_AUTH_PROVIDER: internal
      - if: failure()
        run: tail -n 100 /tmp/api.log /tmp/worker.log /tmp/api-internal.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - run: |
          for o in dev staging prod prod/ambiente; do
            kustomize build deploy/overlays/$o > /dev/null
          done

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          build-args: |
            VITE_OIDC_ISSUER=https://exemplo.zitadel.cloud
            VITE_OIDC_CLIENT_ID=ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
