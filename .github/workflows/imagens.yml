name: Imagens

# Publica as imagens da API/worker e do front no Artifact Registry a cada push
# na main, com a tag do commit. Não faz deploy: produção só muda quando a tag é
# trocada em deploy/overlays/prod e o Argo CD sincroniza.
#
# Fica desligado até as variáveis do repositório existirem (Settings > Secrets
# and variables > Actions > Variables), com os valores das saídas do Terraform:
#   GCP_WIF_PROVIDER   provedor_wif_github
#   GCP_REGISTRO       registro_imagens
#   VITE_OIDC_ISSUER   e VITE_OIDC_CLIENT_ID do app web no Zitadel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGISTRO%%/*}" --quiet
        env:
          GCP_REGISTRO: ${{ vars.GCP_REGISTRO }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.GCP_REGISTRO }}/parceiros:${{ github.sha }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ vars.GCP_REGISTRO }}/parceiros-web:${{ github.sha }}
          build-args: |
            VITE_OIDC_ISSUER=${{ vars.VITE_OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
          cache-from: type=gha,scope=web
